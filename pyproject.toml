[project]
name = "boating-trading-bot"
version = "1.0.0"
description = "Boating Trading Bot - OI Auto Trading"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["flet"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.briefcase]
project_name = "Boating Trading Bot"
bundle = "com.boating.tradingbot"
version = "1.0.0"
description = "OI Auto Trading Bot"

[tool.briefcase.app.boating-trading-bot]
formal_name = "Boating Trading Bot"
description = "Boating Trading Bot - LIVE OI Trading"
sources = ["src/boating_trading_bot"]
requires = ["flet"]
