[project]
name = "boating-trading-bot"
version = "1.0.0"
description = "Boating Trading Bot"
requires-python = ">=3.10"
dependencies = ["flet", "requests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.briefcase]
project_name = "Boating Trading Bot"
bundle = "com.boating.tradingbot"
version = "1.0.0"

[tool.briefcase.app.boatingtradingbot]
formal_name = "Boating Trading Bot"
description = "OI Auto Trading"
sources = ["src/boatingtradingbot"]
requires = ["flet", "requests"]
