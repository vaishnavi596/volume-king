[project]
name = "volume-king"
version = "7.0.0"
description = "Volume King 100% Combined"
requires-python = ">=3.10"
dependencies = ["kivy"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.briefcase]
project_name = "Volume King"
bundle = "com.volumeking.trade"

[tool.briefcase.app.volume-king]
formal_name = "Volume King"
description = "Premium Base + Nifty Base + News Base"
sources = ["src"]
requires = ["kivy"]
