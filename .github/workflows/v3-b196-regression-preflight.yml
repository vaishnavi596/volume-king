name: BOT KING V3 B196 Offline Regression Preflight (No APK)
run-name: V3 Joint Index 429 + Six Box Full Audit • NO APK
# B3 already runs full offline regression for every src/tests push.
# Keep B196 unique extended checks on-demand; B3 alone owns full suite.
# B196 now fails closed unless exact-head B3 SUCCESS exists.
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  regression:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    env:
      PYTHONPATH: src
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      # Release safety: a targeted B196 PASS must not bypass a failed/missing B3.
      - name: Require full B3 regression success for this exact commit SHA
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python - <<'PY'
          import json, os, urllib.parse, urllib.request
          repo=os.environ["GITHUB_REPOSITORY"]
          sha=os.environ["GITHUB_SHA"]
          api="https://api.github.com/repos/"+repo+"/actions/workflows/clone-b3-full-regression.yml/runs"
          url=api+"?"+urllib.parse.urlencode({"head_sha":sha,"per_page":100})
          req=urllib.request.Request(url,headers={
              "Authorization":"Bearer "+os.environ["GH_TOKEN"],
              "Accept":"application/vnd.github+json",
              "X-GitHub-Api-Version":"2022-11-28"})
          with urllib.request.urlopen(req,timeout=20) as response:
              runs=json.load(response).get("workflow_runs",[])
          matching=[r for r in runs if r.get("head_sha")==sha and
                    r.get("conclusion")=="success" and r.get("status")=="completed"]
          if not matching:
              raise SystemExit("B3_EXACT_SHA_NOT_VERIFIED: "+sha+
                               " | run B3 full gate for this SHA before B196")
          print("B3_EXACT_SHA_VERIFIED=PASS run_id="+str(matching[0]["id"]))
          PY
      - name: Install offline test dependencies
        run: |
          python -m pip install --disable-pip-version-check -q -r backend/requirements.txt 'flet==0.25.2' 'flet-webview==0.1.0'
      - name: Verify latest V3 joint source and targeted contracts
        run: |
          python - <<'PY'
          import ast, pathlib, re, tomllib
          version = tomllib.loads(pathlib.Path("pyproject.toml").read_text())["project"]["version"]
          assert re.fullmatch(r"[0-9]+\.[0-9]+\.[0-9]+", version), f"Invalid V3 version: {version}"
          for path in ("src/main.py", "tests/test_market_feed.py", "tests/test_monitoring_audit.py"):
              ast.parse(pathlib.Path(path).read_text(),filename=path)
          source=pathlib.Path("src/main.py").read_text()
          # The production guard is intentionally two lines, not a single-line if.
          assert 'if prefs.get("source")!="Dhan":' in source
          assert 'prefs["source"]="Dhan"' in source
          assert 'if source.value!="Dhan":source.value="Dhan"' in source
          assert 'if selected!="Dhan":' in source
          assert 'V3 Dhan-only provider required' in source
          print("V3_B199_SOURCE_GUARD=PASS")
          PY
          python -m unittest discover -s tests -p 'test_market_feed.py' -v
          python -m unittest discover -s tests -p 'test_monitoring_audit.py' -v
          python -m unittest discover -s tests -p 'test_dhan_index_refresh_regression.py' -v
          python -m unittest discover -s tests -p 'test_v3_clone_quote_pacing.py' -v
          python -m unittest discover -s tests -p 'test_v3_visible_watchlist_bootstrap_priority.py' -v
          python -m unittest discover -s tests -p 'test_v3_watchlist_5_34_70_capacity.py' -v
          python -m unittest discover -s tests -p 'test_v3_watchlist_quote_elapsed_diagnostic.py' -v
          python -m unittest discover -s tests -p 'test_v3_joint_foundation_gate.py' -v
          python -m unittest discover -s tests -p 'test_v3_legacy_provider_quarantine.py' -v
          python -m unittest discover -s tests -p 'test_clone_adapter_audit.py' -v
          python -m unittest discover -s tests -p 'test_clone_b3_market_diagnostics.py' -v
          python -m unittest discover -s tests -p 'test_v3_index_five_box_joint_contract.py' -v
          python -m unittest discover -s tests -p 'test_a3_dashboard_dhan_regressions.py' -v
          python -m unittest discover -s tests -p 'test_b1_five_engine_dhan_shared_option.py' -v
          python -m unittest discover -s tests -p 'test_five_engine.py' -v
          python -m unittest discover -s tests -p 'test_candle_historical_display.py' -v
          python -m unittest discover -s tests -p 'test_v3_clone_quote_pacing_deploy_safety.py' -v
          python -m unittest discover -s tests -p 'test_clone_b3_candle_singleflight_cache.py' -v
          python -m unittest discover -s tests -p 'test_candle_retention.py' -v
          python -m unittest discover -s tests -p 'test_clone_v2_gateway_b2.py' -v
          python -m unittest discover -s tests -p 'test_audit.py' -v
          python -m unittest discover -s tests -p 'test_mobile_regressions.py' -v
      # Full-suite owner is the auto-triggered B3 workflow on the identical SHA.
      # Release gate MUST separately verify B3 PASS before claiming V3 readiness.
      - name: Confirm B196 extra targeted audit complete (B3 full gate is independent)
        run: echo V3_B196_EXTRA_AUDIT=PASS_B3_FULL_GATE_STILL_REQUIRED
