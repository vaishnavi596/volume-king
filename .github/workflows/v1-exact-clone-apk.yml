name: BOT KING Exact V1 Clone Independent APK
run-name: Exact V1 source clone 2.3.131 separate phone APK
on:
  push:
    branches:
      - pilot/v1-untouched-clone-apk-20261120
    paths:
      - .github/workflows/v1-exact-clone-apk.yml
      - src/main.py
      - tests/test_v1_clone_watch_superfive.py
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: v1-exact-clone-apk-${{ github.ref }}
  cancel-in-progress: false
jobs:
  clone:
    runs-on: ubuntu-22.04
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Pinned Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: stable
          cache: true
      - name: Verify only two scoped V1 clone fixes and unchanged login/providers
        run: |
          set -euo pipefail
          test "$(git hash-object src/main.py)" = "40856f5677af06baafc4d6b22c4bbeacf7cfe2ad"
          git diff --quiet HEAD -- src
          python - <<'PY'
          from pathlib import Path
          import tomllib, ast
          p=tomllib.loads(Path("pyproject.toml").read_text())
          assert p["project"]["name"]=="bot-king"
          assert p["project"]["version"]=="2.3.131"
          s=Path("src/main.py").read_text()
          ast.parse(s)
          for required in ("ServerAngelFeed", "ServerDhanReadOnly", "get_yahoo(", 'server_access=ft.TextField', 'api_url=ft.TextField', 'server_trust=ft.Checkbox'):
              assert required in s, f"Original V1 feature unexpectedly missing: {required}"
          print("V1 clone: only Watchlist 3m and Super Five historical presentation changed; server key login UI retained")
          PY
      - name: Run focused clone Watchlist/Super Five regression
        run: |
          set -euo pipefail
          python -m unittest discover -s tests -p "test_v1_clone_watch_superfive.py" -v
      - name: Set up independent test-only APK signer
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/v1-exact-clone"
          PASS="$(openssl rand -hex 24)"
          echo "::add-mask::$PASS"
          printf '%s' "$PASS" > "$RUNNER_TEMP/v1-exact-clone/sign-pass"
          chmod 600 "$RUNNER_TEMP/v1-exact-clone/sign-pass"
          keytool -genkeypair -noprompt -keystore "$RUNNER_TEMP/v1-exact-clone/test.jks" -storetype PKCS12 -alias v1_exact_clone -keyalg RSA -keysize 3072 -validity 90 -dname "CN=BOT KING V1 EXACT CLONE TEST" -storepass "$PASS" -keypass "$PASS"
      - name: Build V1 original UI with distinct Android package
        shell: bash
        env:
          FLET_ANDROID_SIGNING_KEY_STORE: ${{ runner.temp }}/v1-exact-clone/test.jks
          FLET_ANDROID_SIGNING_KEY_ALIAS: v1_exact_clone
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check 'flet==0.25.2' 'flet-cli==0.25.2' 'flet-webview==0.1.0'
          export FLET_ANDROID_SIGNING_KEY_STORE_PASSWORD="$(cat "$RUNNER_TEMP/v1-exact-clone/sign-pass")"
          export FLET_ANDROID_SIGNING_KEY_PASSWORD="$FLET_ANDROID_SIGNING_KEY_STORE_PASSWORD"
          python - <<'PY'
          from pathlib import Path
          Path("src/_build_version.py").write_text("BUILD_VERSION = '2.3.131'\n")
          PY
          mkdir -p "$GITHUB_WORKSPACE/dist/exact-clone"
          flet build apk --project bot_king_v1_clone --org com.botking.clone --product 'BOT KING V1 CLONE' --build-number 131 --build-version 2.3.131 --output "$GITHUB_WORKSPACE/dist/exact-clone" --verbose
      - name: Verify actual APK identity, version and certificate
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t apks < <(find dist/exact-clone -type f -name '*.apk' | sort)
          test "${#apks[@]}" -eq 1
          APK="${apks[0]}"
          SDK="${ANDROID_HOME:-$HOME/Android/Sdk}"
          AAPT="$(find "$SDK/build-tools" -maxdepth 2 -type f -name aapt -print | sort -V | tail -1)"
          SIGNER="$(find "$SDK/build-tools" -maxdepth 2 -type f -name apksigner -print | sort -V | tail -1)"
          test -x "$AAPT" && test -x "$SIGNER"
          BADGING="$("$AAPT" dump badging "$APK")"
          printf '%s\n' "$BADGING" | grep -E "^package: name='com\\.botking\\.clone\\.bot_king_v1_clone' versionCode='131' versionName='2\\.3\\.131'"
          printf '%s\n' "$BADGING" | grep -F "application-label:'BOT KING V1 CLONE'"
          ! printf '%s\n' "$BADGING" | grep -F "package: name='com.botking.bot_king'"
          "$SIGNER" verify --verbose --print-certs "$APK" | grep -Ei '(verified using v2 scheme|certificate SHA-256)'
          sha256sum "$APK"
      - name: Publish phone-test clone APK
        uses: actions/upload-artifact@v4
        with:
          name: BOT-KING-V1-EXACT-CLONE-2.3.131-APK
          path: dist/exact-clone/**/*.apk
          if-no-files-found: error
          retention-days: 14
      - name: Remove temporary test-only signer
        if: always()
        shell: bash
        run: rm -rf "$RUNNER_TEMP/v1-exact-clone"
