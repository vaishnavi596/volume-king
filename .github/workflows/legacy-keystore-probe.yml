name: Legacy Flet Keystore Flutter Dependency Probe
on:
  push:
    branches:
      - experiment/android-secure-storage-compat
    paths:
      - .github/workflows/legacy-keystore-probe.yml
  workflow_dispatch:
jobs:
  flutter-plugin-compat:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: stable
          cache: true
      - name: Check Flutter version
        run: flutter --version
      - name: Resolve Keystore plugin against production Flutter version
        run: |
          set -euo pipefail
          flutter create --platforms=android --project-name botking_keystore_probe /tmp/botking_keystore_probe
          cd /tmp/botking_keystore_probe
          flutter pub add flutter_secure_storage:9.2.4
          flutter pub get
          flutter pub deps --style=compact | grep -E 'flutter_secure_storage|flutter_secure_storage_platform_interface'
      - name: Verify Android plugin compiles in isolation
        run: |
          cd /tmp/botking_keystore_probe
          flutter build apk --debug --target-platform android-arm64
