name: BOT KING V3 Joint Adapter End-to-End Source Check (No APK)
run-name: V3 Retired Providers Clone Bootstrap Final Targeted Safety • NO APK
on:
  push:
    branches:
      - pilot/v1-pure-original-clone-phone-20261120
    paths:
      - .github/workflows/v3-joint-adapter-wiring-check.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  adapter:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install tests only (no Android signing or provider requests)
        run: |
          python -m pip install --disable-pip-version-check -q -r backend/requirements.txt 'flet==0.25.2' 'flet-webview==0.1.0'
      - name: Check changed source syntax, adapter wiring and mocked transport
        run: |
          python -m py_compile src/main.py src/five_engine.py src/clone_v2_gateway.py src/candle_retention.py backend/clone_v2_gateway.py
          python -m unittest discover -s tests -p 'test_v3_joint_foundation_gate.py' -v
          python -m unittest discover -s tests -p 'test_clone_adapter_audit.py' -v
          python -m unittest discover -s tests -p 'test_clone_b3_market_diagnostics.py' -v
          python -m unittest discover -s tests -p 'test_clone_b3_candle_singleflight_cache.py' -v
          python -m unittest discover -s tests -p 'test_clone_v2_gateway_b2.py' -v
          python -m unittest discover -s tests -p 'test_v3_clone_quote_pacing.py' -v
          python -m unittest discover -s tests -p 'test_candle_retention.py' -v
          python -m unittest discover -s tests -p 'test_127_b_direct_equity_bootstrap.py' -v
          python -m unittest discover -s tests -p 'test_dhan_activation.py' -v
          python -m unittest discover -s tests -p 'test_dhan_bootstrap_behavior.py' -v
          python -m unittest discover -s tests -p 'test_dhan_index_poll_rate_guard.py' -v
          python -m unittest discover -s tests -p 'test_dhan_login_singleflight.py' -v
          python -m unittest discover -s tests -p 'test_dhan_market_default.py' -v
          python -m unittest discover -s tests -p 'test_dhan_source_context.py' -v
          python -m unittest discover -s tests -p 'test_explicit_provider_selection.py' -v
          python -m unittest discover -s tests -p 'test_joint_bootstrap_options_127.py' -v
          python -m unittest discover -s tests -p 'test_option_history_ingress.py' -v
          python -m unittest discover -s tests -p 'test_provider_error_clarity.py' -v
          python -m unittest discover -s tests -p 'test_watch_countdown_incremental.py' -v
          python -m unittest discover -s tests -p 'test_watchlist_partial_snapshot.py' -v
          python -m unittest discover -s tests -p 'test_watchlist_wiring.py' -v
          python -m unittest discover -s tests -p 'test_v3_legacy_provider_quarantine.py' -v
          python -m unittest discover -s tests -p 'test_clone_b1_market_status_contract.py' -v
          python -m unittest discover -s tests -p 'test_market_feed.py' -v
          python -m unittest discover -s tests -p 'test_mobile_regressions.py' -v
          echo V3_RETIRED_PROVIDER_CLONE_BOOTSTRAP_TARGETED_GATE=PASS
