name: BOT KING V2 Oracle Isolated Python Runtime Prep
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: botking-oracle-remote-management
  cancel-in-progress: false
jobs:
  prepare:
    runs-on: ubuntu-22.04
    environment: oracle-v2
    timeout-minutes: 15
    steps:
      - name: Prepare isolated V2 virtualenv and run disabled shell smoke
        shell: bash
        env:
          ORACLE_HOST: ${{ secrets.ORACLE_HOST }}
          ORACLE_SSH_KEY: ${{ secrets.ORACLE_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          test -n "$ORACLE_HOST" && test -n "$ORACLE_SSH_KEY"
          case "$ORACLE_HOST" in *[!a-zA-Z0-9.:-]*|"") echo INVALID_HOST; exit 1;; esac
          umask 077
          mkdir -p "$HOME/.ssh"
          chmod 700 "$HOME/.ssh"
          printf '%s\n' "$ORACLE_SSH_KEY" | tr -d '\r' > "$HOME/.ssh/botking_oracle"
          printf '%s ssh-ed25519 %s\n' "$ORACLE_HOST" 'AAAAC3NzaC1lZDI1NTE5AAAAIPZcGGcUv+XxxpyAgGcwlAusDv5RvrIB8HaOnKYkbFFu' > "$HOME/.ssh/known_hosts"
          trap 'rm -f "$HOME/.ssh/botking_oracle" "$HOME/.ssh/known_hosts"' EXIT
          chmod 600 "$HOME/.ssh/botking_oracle" "$HOME/.ssh/known_hosts"
          ssh -i "$HOME/.ssh/botking_oracle" -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o BatchMode=yes -o ConnectTimeout=10 "opc@$ORACLE_HOST" 'bash -s' <<'REMOTE'
          set -eu
          umask 077
          ROOT=/home/opc/botking-v2-staging/gh-7757df1e35c9846d8ef0296c4d1eefa733711a80
          test -f "$ROOT/manifest.json"
          python3 - "$ROOT/manifest.json" <<'PY'
          import json, sys
          with open(sys.argv[1]) as f: m=json.load(f)
          assert m["commit"] == "7757df1e35c9846d8ef0296c4d1eefa733711a80" and m["activated"] is False
          PY
          test ! -L "$ROOT"
          if [ ! -e "$ROOT/.venv/bin/python" ]; then
            python3 -m venv "$ROOT/.venv"
          fi
          "$ROOT/.venv/bin/python" -m pip install --disable-pip-version-check --no-input 'fastapi==0.115.12' 'uvicorn==0.34.2' 'httpx==0.28.1' 'cryptography==44.0.3'
          cd "$ROOT"
          "$ROOT/.venv/bin/python" - <<'PY'
          import fastapi, uvicorn, httpx, cryptography
          from fastapi.testclient import TestClient
          from pilot_v2.isolated_gateway_app import create_app
          c=TestClient(create_app())
          health=c.get("/v2-pilot/health")
          assert health.status_code == 200
          assert health.json()["status"] == "staged_disabled"
          assert health.json()["live_data"] is False
          assert health.json()["live_orders_enabled"] is False
          assert c.get("/v2-pilot/indices").status_code == 401
          assert c.get("/v2-pilot/orders").status_code == 404
          print("V2_DISABLED_RUNTIME_SMOKE=PASS")
          PY
          test "$(systemctl is-active bot-king.service)" = active
          test "$(curl -sS -o /dev/null -w '%{http_code}' http://127.0.0.1:8000/health)" = 200
          echo "V1_HEALTH=PASS; V2_RUNTIME_PREP=PASS; V2_ACTIVATED=NO"
          REMOTE
