name: BOT KING V2 Oracle Activation Readiness (Read Only)
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: botking-oracle-remote-management
  cancel-in-progress: false
jobs:
  readiness:
    runs-on: ubuntu-22.04
    environment: oracle-v2
    timeout-minutes: 7
    steps:
      - name: Examine staged V2, dependencies and V1 safety
        shell: bash
        env:
          ORACLE_HOST: ${{ secrets.ORACLE_HOST }}
          ORACLE_SSH_KEY: ${{ secrets.ORACLE_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          test -n "$ORACLE_HOST" && test -n "$ORACLE_SSH_KEY"
          case "$ORACLE_HOST" in *[!a-zA-Z0-9.:-]*|"") echo INVALID_HOST; exit 1;; esac
          mkdir -p "$HOME/.ssh"
          chmod 700 "$HOME/.ssh"
          umask 077
          printf '%s\n' "$ORACLE_SSH_KEY" | tr -d '\r' > "$HOME/.ssh/botking_oracle"
          printf '%s ssh-ed25519 %s\n' "$ORACLE_HOST" 'AAAAC3NzaC1lZDI1NTE5AAAAIPZcGGcUv+XxxpyAgGcwlAusDv5RvrIB8HaOnKYkbFFu' > "$HOME/.ssh/known_hosts"
          trap 'rm -f "$HOME/.ssh/botking_oracle" "$HOME/.ssh/known_hosts"' EXIT
          chmod 600 "$HOME/.ssh/botking_oracle" "$HOME/.ssh/known_hosts"
          ssh -i "$HOME/.ssh/botking_oracle" -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o BatchMode=yes -o ConnectTimeout=10 "opc@$ORACLE_HOST" 'bash -s' <<'REMOTE'
          set -eu
          STAGED=/home/opc/botking-v2-staging/gh-7757df1e35c9846d8ef0296c4d1eefa733711a80
          echo 'V2_READINESS=START'
          test -r "$STAGED/manifest.json"
          python3 - "$STAGED/manifest.json" <<'PY'
          import json,sys
          with open(sys.argv[1]) as f: m=json.load(f)
          assert m["commit"] == "7757df1e35c9846d8ef0296c4d1eefa733711a80"
          assert m["source_count"] == 35 and m["activated"] is False
          print("STAGE_MANIFEST=VALID_UNACTIVATED")
          PY
          python3 - "$STAGED" <<'PY'
          import ast, pathlib, sys
          p=pathlib.Path(sys.argv[1])/"pilot_v2"
          for name in ("oracle_runtime_factory.py","unified_gateway_app.py","oracle_dhan_read_transport.py"):
              ast.parse((p/name).read_text())
          print("V2_SOURCE_PARSE=PASS")
          for name in ("fastapi","uvicorn","cryptography","httpx"):
              try:
                  __import__(name)
                  print("DEPENDENCY_"+name.upper()+"=AVAILABLE")
              except ImportError:
                  print("DEPENDENCY_"+name.upper()+"=MISSING")
          PY
          echo "V1_ACTIVE=$(systemctl is-active bot-king.service || true)"
          echo "V2_UNIT=$(systemctl show bot-king-v2.service -p LoadState --value || true)"
          echo "V2_ACTIVE=$(systemctl is-active bot-king-v2.service || true)"
          echo "V1_HEALTH_HTTP=$(curl -sS -o /dev/null --max-time 7 -w '%{http_code}' http://127.0.0.1:8000/health)"
          if ss -lnt '( sport = :8001 )' | grep -q LISTEN; then echo V2_PORT=LISTEN; else echo V2_PORT=ABSENT; fi
          echo "V2_READINESS=INSPECTED_NOT_ACTIVATED"
          REMOTE
