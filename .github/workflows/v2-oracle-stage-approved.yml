name: BOT KING V2 Oracle Source Stage (No Activation)
on:
  workflow_dispatch:

permissions:
  contents: read
concurrency:
  group: botking-oracle-remote-management
  cancel-in-progress: false

jobs:
  stage-only:
    runs-on: ubuntu-22.04
    environment: oracle-v2
    timeout-minutes: 15
    steps:
      - name: Checkout approved V2 pilot source only
        uses: actions/checkout@v4
        with:
          ref: 7757df1e35c9846d8ef0296c4d1eefa733711a80
          persist-credentials: false
      - name: Verify and stage V2 source without activating server
        shell: bash
        env:
          ORACLE_HOST: ${{ secrets.ORACLE_HOST }}
          ORACLE_SSH_KEY: ${{ secrets.ORACLE_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          SHA=7757df1e35c9846d8ef0296c4d1eefa733711a80
          test "$(git rev-parse HEAD)" = "$SHA"
          python -m compileall -q pilot_v2
          python pilot_v2/tools/one_click_migration_gate.py
          test -n "$ORACLE_HOST" && test -n "$ORACLE_SSH_KEY"
          case "$ORACLE_HOST" in *[!a-zA-Z0-9.:-]*|"") echo INVALID_ORACLE_HOST; exit 1;; esac
          mkdir -p "$HOME/.ssh"
          chmod 700 "$HOME/.ssh"
          umask 077
          printf '%s\n' "$ORACLE_SSH_KEY" | tr -d '\r' > "$HOME/.ssh/botking_oracle"
          # Owner-verified ED25519 public host key, strict verification ON.
          printf '%s ssh-ed25519 %s\n' "$ORACLE_HOST" 'AAAAC3NzaC1lZDI1NTE5AAAAIPZcGGcUv+XxxpyAgGcwlAusDv5RvrIB8HaOnKYkbFFu' > "$HOME/.ssh/known_hosts"
          trap 'rm -f "$HOME/.ssh/botking_oracle" "$HOME/.ssh/known_hosts" /tmp/botking-v2-approved-source.tgz' EXIT
          chmod 600 "$HOME/.ssh/botking_oracle" "$HOME/.ssh/known_hosts"
          ssh-keygen -y -P '' -f "$HOME/.ssh/botking_oracle" >/dev/null 2>&1
          tar -czf /tmp/botking-v2-approved-source.tgz -C pilot_v2 -- $(cd pilot_v2 && ls *.py)
          HASH="$(sha256sum /tmp/botking-v2-approved-source.tgz | cut -d' ' -f1)"
          SSH=(ssh -i "$HOME/.ssh/botking_oracle" -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o BatchMode=yes -o ConnectTimeout=10)
          SCP=(scp -i "$HOME/.ssh/botking_oracle" -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o BatchMode=yes)
          "${SSH[@]}" "opc@$ORACLE_HOST" "mkdir -p /home/opc/botking-v2-staging && chmod 700 /home/opc/botking-v2-staging"
          "${SCP[@]}" /tmp/botking-v2-approved-source.tgz pilot_v2/tools/remote_stage_archive.py "opc@$ORACLE_HOST:/home/opc/botking-v2-staging/"
          # Remote tmp cleanup happens even if SHA validation or staging fails.
          "${SSH[@]}" "opc@$ORACLE_HOST" "trap 'rm -f /home/opc/botking-v2-staging/botking-v2-approved-source.tgz /home/opc/botking-v2-staging/remote_stage_archive.py' EXIT; python3 /home/opc/botking-v2-staging/remote_stage_archive.py --archive /home/opc/botking-v2-staging/botking-v2-approved-source.tgz --sha $SHA --checksum $HASH --root /home/opc/botking-v2-staging"
          "${SSH[@]}" "opc@$ORACLE_HOST" 'test "$(systemctl is-active bot-king.service)" = active && test "$(curl -sS -o /dev/null -w "%{http_code}" http://127.0.0.1:8000/health)" = 200'
          echo "V2_STAGE=SUCCESS; SERVICE_ACTIVATED=NO; V1=UNCHANGED"
