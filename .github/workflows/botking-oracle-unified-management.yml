name: BOT KING Oracle Unified Remote Management
run-name: Oracle ${{ inputs.operation }} (owner-controlled)

on:
  workflow_dispatch:
    inputs:
      operation:
        description: "One gateway: audit or owner-approved maintenance"
        required: true
        type: choice
        options:
          - audit
          - prepare_v2
          - live_preflight
          - stage_v2
          - activate_v2
          - maintenance
        default: audit
      command:
        description: "For maintenance only: reviewed Linux command, NO passwords/keys"
        required: false
        type: string
        default: ""
      approval:
        description: "For maintenance enter exactly APPROVE_ORACLE_CHANGE"
        required: false
        type: string
        default: ""

permissions:
  contents: read

concurrency:
  group: botking-oracle-remote-management
  cancel-in-progress: false

jobs:
  oracle:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-22.04
    environment: oracle-v2
    timeout-minutes: 15
    steps:
      - name: Checkout exact reviewed V2 branch snapshot for staging only
        if: inputs.operation == 'stage_v2'
        uses: actions/checkout@v4
        with:
          ref: 94e814031896445874fa3f81677b85d118584f40
          persist-credentials: false
      - name: Connect securely with existing owner-authorized key
        shell: bash
        env:
          ORACLE_HOST: ${{ secrets.ORACLE_HOST }}
          ORACLE_SSH_KEY: ${{ secrets.ORACLE_SSH_PRIVATE_KEY }}
          OPERATION: ${{ inputs.operation }}
          OWNER_COMMAND: ${{ inputs.command }}
          APPROVAL: ${{ inputs.approval }}
        run: |
          set -euo pipefail
          test -n "$ORACLE_HOST" && test -n "$ORACLE_SSH_KEY"
          case "$ORACLE_HOST" in *[!a-zA-Z0-9.:-]*|"") echo "INVALID_ORACLE_HOST"; exit 1;; esac
          umask 077
          mkdir -p "$HOME/.ssh"
          chmod 700 "$HOME/.ssh"
          printf '%s\n' "$ORACLE_SSH_KEY" | tr -d '\r' > "$HOME/.ssh/botking_oracle"
          # Owner verified the actual host's public key from its trusted console.
          printf '%s ssh-ed25519 %s\n' "$ORACLE_HOST" \
            'AAAAC3NzaC1lZDI1NTE5AAAAIPZcGGcUv+XxxpyAgGcwlAusDv5RvrIB8HaOnKYkbFFu' \
            > "$HOME/.ssh/known_hosts"
          trap 'rm -f "$HOME/.ssh/botking_oracle" "$HOME/.ssh/known_hosts"' EXIT
          chmod 600 "$HOME/.ssh/botking_oracle" "$HOME/.ssh/known_hosts"
          ssh-keygen -y -P '' -f "$HOME/.ssh/botking_oracle" >/dev/null 2>&1
          SSH=(ssh -T -i "$HOME/.ssh/botking_oracle" -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes -o BatchMode=yes -o ConnectTimeout=10)
          if [ "$OPERATION" = "audit" ]; then
            test -z "$OWNER_COMMAND"
            "${SSH[@]}" "opc@$ORACLE_HOST" 'bash -s' <<'REMOTE'
          set -eu
          echo "SSH_STATUS=CONNECTED"
          echo "REMOTE_USER=$(id -un)"
          echo "REMOTE_HOST=$(hostname -s)"
          echo "V1_SERVICE=$(systemctl is-active bot-king.service || true)"
          echo "V2_SERVICE=$(systemctl is-active bot-king-v2.service || true)"
          echo "V1_HEALTH_HTTP=$(curl -sS -o /dev/null --max-time 8 -w '%{http_code}' http://127.0.0.1:8000/health)"
          if ss -lnt '( sport = :8001 )' | grep -q LISTEN; then echo V2_PORT=LISTEN; else echo V2_PORT=ABSENT; fi
          if sudo -n true >/dev/null 2>&1; then
            echo "PASSWORDLESS_SUDO=AVAILABLE"
          else
            echo "PASSWORDLESS_SUDO=NOT_VERIFIED"
          fi
          STAGE=/home/opc/botking-v2-staging/gh-94e814031896445874fa3f81677b85d118584f40
          if test -r "$STAGE/manifest.json"; then
            echo "V2_STAGE=PRESENT"
            if test -x "$STAGE/.venv/bin/python"; then
              echo "V2_VENV=PRESENT"
              "$STAGE/.venv/bin/python" -c 'import importlib.util; print("V2_DEPENDENCIES="+",".join(k+":"+("YES" if importlib.util.find_spec(k) else "NO") for k in ("fastapi","uvicorn","httpx","cryptography")))'
            else
              echo "V2_VENV=ABSENT"
            fi
          else
            echo "V2_STAGE=ABSENT"
          fi
          echo "V2_PUBLIC_HEALTH_HTTP=$(curl -sS -o /dev/null --max-time 7 -w '%{http_code}' https://botkingrajesh.duckdns.org/v2-pilot/health || true)"
          echo "V2_LOCAL_HEALTH_HTTP=$(curl -sS -o /dev/null --max-time 7 -w '%{http_code}' http://127.0.0.1:8001/v2-pilot/health || true)"
          echo "V1_READ_ROUTE_HTTP=$(curl -sS -o /dev/null --max-time 7 -w '%{http_code}' -X POST http://127.0.0.1:8000/dhan/index-ltp-batch || true)"
          if [ -r /home/opc/botking-v2-staging/gh-94e814031896445874fa3f81677b85d118584f40/manifest.json ]; then
            python3 - <<'PY'
          import json
          p="/home/opc/botking-v2-staging/gh-94e814031896445874fa3f81677b85d118584f40/manifest.json"
          m=json.load(open(p))
          print("V2_38_FILE_MANIFEST="+("VERIFIED" if m.get("commit")=="94e814031896445874fa3f81677b85d118584f40" and m.get("source_count")==38 and m.get("activated") is False else "MISMATCH"))
          PY
          fi
          if [ -f /home/opc/botking-v2-private/v2.env ] && [ ! -L /home/opc/botking-v2-private/v2.env ]; then
            echo "V2_PRIVATE_ENV=PRESENT_NO_CONTENT_PRINTED"
          else
            echo "V2_PRIVATE_ENV=ABSENT_OR_UNSAFE"
          fi
          if sudo -n nginx -t >/dev/null 2>&1; then echo NGINX_SYNTAX=PASS; else echo NGINX_SYNTAX=UNVERIFIED; fi
          # Single bounded read-only inventory. No secrets, master ids or key contents are printed.
          if [ -x "$STAGE/.venv/bin/python" ] && [ -f /home/opc/botking-v2-private/v2.env ] && [ ! -L /home/opc/botking-v2-private/v2.env ]; then
            if (cd "$STAGE" && "$STAGE/.venv/bin/python" -m pilot_v2.tools.v2_activation_gate --private-env-file /home/opc/botking-v2-private/v2.env) >/dev/null 2>&1; then
              echo "V2_REAL_MASTER_AND_PAIRING=LOCALLY_VERIFIED"
            else
              echo "V2_REAL_MASTER_AND_PAIRING=BLOCKED"
            fi
          else
            echo "V2_REAL_MASTER_AND_PAIRING=NOT_PROVISIONED"
          fi
          if sudo -n nginx -t >/dev/null 2>&1 && sudo -n nginx -T 2>/dev/null | python3 -c '
          import re,sys
          config=re.sub(r"(?m)#.*$", "", sys.stdin.read())
          location=re.compile(r"location\\s+(?:\\^~\\s+)?(?:=\\s+)?/v2-pilot/\\s*\\{")
          for m in location.finditer(config):
              depth=1; i=m.end()
              while i<len(config) and depth:
                  if config[i]=="{": depth+=1
                  elif config[i]=="}": depth-=1
                  i+=1
              if depth: continue
              b=config[m.end():i-1]
              if re.search(r"\\bproxy_pass\\s+http://127\\.0\\.0\\.1:8001\\s*;", b) and not re.search(r"\\brewrite\\s", b): sys.exit(0)
          sys.exit(1)
          '; then
            echo "V2_HTTPS_ROUTE_TO_8001=CONFIGURED"
          else
            echo "V2_HTTPS_ROUTE_TO_8001=NOT_VERIFIED"
          fi
          echo "V2_DHAN_AUTHENTICATED_QUOTE=NOT_VERIFIED"
          echo "V2_PHONE_SIGNED_LOGIN=NOT_VERIFIED"
          echo "V2_READINESS_AUDIT=COMPLETE_NO_CHANGES"
          REMOTE
          elif [ "$OPERATION" = "prepare_v2" ]; then
            test -z "$OWNER_COMMAND"
            echo "V2_PREPARE=START; V1_WRITES=NONE; V2_SERVICE_ACTIVATED=NO"
            "${SSH[@]}" "opc@$ORACLE_HOST" 'bash -s' <<'REMOTE'
          set -eu
          umask 077
          ROOT=/home/opc/botking-v2-staging/gh-7757df1e35c9846d8ef0296c4d1eefa733711a80
          test -r "$ROOT/manifest.json"
          python3 - "$ROOT/manifest.json" <<'PY'
          import json,sys
          with open(sys.argv[1]) as f: manifest=json.load(f)
          assert manifest["commit"] == "7757df1e35c9846d8ef0296c4d1eefa733711a80"
          assert manifest["activated"] is False and manifest["source_count"] == 35
          print("V2_MANIFEST=VERIFIED")
          PY
          test ! -L "$ROOT"
          if [ ! -x "$ROOT/.venv/bin/python" ]; then
            python3 -m venv "$ROOT/.venv"
          fi
          "$ROOT/.venv/bin/python" -m pip install --disable-pip-version-check --no-input "fastapi==0.115.12" "uvicorn==0.34.2" "httpx==0.28.1" "cryptography==44.0.3"
          cd "$ROOT"
          "$ROOT/.venv/bin/python" - <<'PY'
          from fastapi.testclient import TestClient
          from pilot_v2.isolated_gateway_app import create_app
          client=TestClient(create_app())
          response=client.get("/v2-pilot/health")
          assert response.status_code == 200
          assert response.json()["status"] == "staged_disabled"
          assert response.json()["live_data"] is False
          assert response.json()["live_orders_enabled"] is False
          assert client.get("/v2-pilot/indices").status_code == 401
          assert client.get("/v2-pilot/orders").status_code == 404
          print("V2_DISABLED_SMOKE=PASS")
          PY
          test "$(systemctl is-active bot-king.service)" = "active"
          test "$(curl -sS -o /dev/null -w '%{http_code}' --max-time 8 http://127.0.0.1:8000/health)" = "200"
          echo "V2_RUNTIME=READY; V1=HEALTHY_UNCHANGED; V2_SERVICE_ACTIVATED=NO"
          REMOTE
          echo "V2_PREPARE=SUCCESS"
          elif [ "$OPERATION" = "live_preflight" ]; then
            test -z "$OWNER_COMMAND"
            "${SSH[@]}" "opc@$ORACLE_HOST" 'bash -s' <<'REMOTE'
          set -eu
          ROOT=/home/opc/botking-v2-staging/gh-94e814031896445874fa3f81677b85d118584f40
          test -x "$ROOT/.venv/bin/python"
          test -r "$ROOT/manifest.json"
          cd "$ROOT"
          "$ROOT/.venv/bin/python" - <<'PY'
          import json, pathlib, importlib.util
          m=json.loads(pathlib.Path("manifest.json").read_text())
          assert m["commit"] == "94e814031896445874fa3f81677b85d118584f40"
          assert not m["activated"] and m["source_count"] == 38
          for n in ("fastapi", "uvicorn", "httpx", "cryptography"):
              assert importlib.util.find_spec(n)
          for n in ("oracle_runtime_factory.py", "durable_device_sessions.py", "durable_device_keys.py", "atomic_verified_login.py", "oracle_dhan_read_transport.py", "trusted_http_adapter.py", "tools/v2_activation_gate.py", "tools/provision_oracle_master.py"):
              assert (pathlib.Path("pilot_v2")/n).is_file(), n
          from pilot_v2.oracle_runtime_factory import create_oracle_v2_runtime
          try:
              create_oracle_v2_runtime(db_path="/dev/null", master_device_id="", master_public_der=b"", pairing_key="")
          except ValueError:
              print("V2_MISSING_MASTER_OR_PAIRING=FAIL_CLOSED")
          else:
              raise AssertionError("Runtime accepted missing authorization")
          print("V2_38_SOURCE_TOOLS_AND_DEPENDENCIES=PASS")
          PY
          echo "V2_SYSTEMD_LOAD=$(systemctl show bot-king-v2.service --property=LoadState --value || true)"
          echo "V2_SYSTEMD_ACTIVE=$(systemctl is-active bot-king-v2.service || true)"
          echo "V2_HTTPS_ROUTE_HTTP=$(curl -fsS -o /dev/null --max-time 7 -w '%{http_code}' https://botkingrajesh.duckdns.org/v2-pilot/health || true)"
          echo "V2_AUTHORIZED_MASTER_PROVISIONING=NOT_VERIFIED"
          echo "V2_DHAN_PRIVATE_PAIRING=NOT_VERIFIED"
          echo "V2_REAL_PHONE_SIGNED_LOGIN=NOT_VERIFIED"
          echo "V2_LIVE_DHAN_QUOTE=NOT_VERIFIED"
          test "$(systemctl is-active bot-king.service)" = "active"
          test "$(curl -fsS -o /dev/null --max-time 7 -w '%{http_code}' http://127.0.0.1:8000/health)" = "200"
          echo "V1_SERVICE=HEALTHY_UNCHANGED"
          echo "LIVE_PREFLIGHT=COMPLETE; LIVE_ACTIVATION=NOT_CLAIMED"
          REMOTE
          elif [ "$OPERATION" = "stage_v2" ]; then
            test -z "$OWNER_COMMAND"
            SHA=94e814031896445874fa3f81677b85d118584f40
            test "$(git rev-parse HEAD)" = "$SHA"
            python3 -m compileall -q pilot_v2
            tar -czf "$RUNNER_TEMP/botking-v2-source.tar.gz" -C pilot_v2 -- $(cd pilot_v2 && ls *.py) tools/v2_activation_gate.py tools/provision_oracle_master.py
            HASH="$(sha256sum "$RUNNER_TEMP/botking-v2-source.tar.gz" | cut -d" " -f1)"
            SCP=(scp -i "$HOME/.ssh/botking_oracle" -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o BatchMode=yes)
            "${SSH[@]}" "opc@$ORACLE_HOST" 'mkdir -p /home/opc/botking-v2-staging && chmod 700 /home/opc/botking-v2-staging'
            "${SCP[@]}" "$RUNNER_TEMP/botking-v2-source.tar.gz" pilot_v2/tools/remote_stage_archive.py "opc@$ORACLE_HOST:/home/opc/botking-v2-staging/"
            "${SSH[@]}" "opc@$ORACLE_HOST" "trap 'rm -f /home/opc/botking-v2-staging/botking-v2-source.tar.gz /home/opc/botking-v2-staging/remote_stage_archive.py' EXIT; python3 /home/opc/botking-v2-staging/remote_stage_archive.py --archive /home/opc/botking-v2-staging/botking-v2-source.tar.gz --sha $SHA --checksum $HASH --root /home/opc/botking-v2-staging"
            "${SSH[@]}" "opc@$ORACLE_HOST" "STAGE_SHA=$SHA bash -s" <<'REMOTE'
          set -eu
          umask 077
          ROOT="/home/opc/botking-v2-staging/gh-$STAGE_SHA"
          test -f "$ROOT/manifest.json"
          python3 - "$ROOT/manifest.json" "$STAGE_SHA" <<'PY'
          import json, sys
          m=json.load(open(sys.argv[1]))
          assert m["commit"] == sys.argv[2] and m["activated"] is False
          assert m["source_count"] >= 38
          print("V2_NEW_STAGE_MANIFEST=VERIFIED")
          PY
          test ! -L "$ROOT"
          test -f "$ROOT/pilot_v2/tools/v2_activation_gate.py"
          test -f "$ROOT/pilot_v2/tools/provision_oracle_master.py"
          python3 -m venv "$ROOT/.venv"
          "$ROOT/.venv/bin/python" -m pip install --disable-pip-version-check --no-input -q "fastapi==0.115.12" "uvicorn==0.34.2" "httpx==0.28.1" "cryptography==44.0.3"
          cd "$ROOT"
          "$ROOT/.venv/bin/python" - <<'PY'
          from fastapi.testclient import TestClient
          from pilot_v2.oracle_secure_entrypoint import create_app
          try:
              create_app()
          except ValueError:
              print("V2_UNPROVISIONED_START=BLOCKED_AS_REQUIRED")
          else:
              raise AssertionError("Unprovisioned production app must fail closed")
          from pilot_v2.isolated_gateway_app import create_app as isolated
          c=TestClient(isolated())
          assert c.get("/v2-pilot/health").json()["live_data"] is False
          assert c.get("/v2-pilot/quotes").status_code == 401
          assert c.get("/v2-pilot/orders").status_code == 404
          print("V2_NEW_STAGE_RUNTIME_SMOKE=PASS")
          PY
          REMOTE
            rm -f "$RUNNER_TEMP/botking-v2-source.tar.gz"
            "${SSH[@]}" "opc@$ORACLE_HOST" 'test "$(systemctl is-active bot-king.service)" = active && test "$(curl -fsS -o /dev/null -w "%{http_code}" http://127.0.0.1:8000/health)" = 200'
            echo "V2_NEW_SOURCE_STAGE_AND_RUNTIME=SUCCESS; V2_ACTIVATED=NO; V1=HEALTHY"
          elif [ "$OPERATION" = "activate_v2" ]; then
            test -z "$OWNER_COMMAND"
            if [ "$APPROVAL" != "APPROVE_V2_LIVE" ]; then
              echo "V2_ACTIVATION=BLOCKED_OWNER_APPROVAL_REQUIRED"; exit 1
            fi
            "${SSH[@]}" "opc@$ORACLE_HOST" 'bash -s' <<'ACTIVATE'
          set -euo pipefail
          umask 077
          ROOT=/home/opc/botking-v2-staging/gh-94e814031896445874fa3f81677b85d118584f40
          PRIVATE=/home/opc/botking-v2-private/v2.env
          UNIT=/etc/systemd/system/bot-king-v2.service
          echo "V2_ONE_CLICK_ACTIVATION=BEGIN"
          test -x "$ROOT/.venv/bin/python"
          test -f "$ROOT/pilot_v2/tools/v2_activation_gate.py"
          test -f "$ROOT/pilot_v2/tools/provision_oracle_master.py"
          test -r "$ROOT/manifest.json"
          "$ROOT/.venv/bin/python" - "$ROOT/manifest.json" <<'PY'
          import json, sys
          m = json.load(open(sys.argv[1]))
          assert m["commit"] == "94e814031896445874fa3f81677b85d118584f40"
          assert m["source_count"] == 38 and m["activated"] is False
          assert m["archive_sha256"] == "d592fd686dfb059b33d5b98fa42cb380f17403688b543e384c9f20d9d41358a2"
          print("V2_PINNED_ARCHIVE=VERIFIED")
          PY
          test "$(systemctl is-active bot-king.service)" = active
          test "$(curl -fsS -o /dev/null -w '%{http_code}' --max-time 8 http://127.0.0.1:8000/health)" = 200
          test "$(id -un)" = opc
          if [ ! -f "$PRIVATE" ] || [ -L "$PRIVATE" ]; then
            echo "V2_ACTIVATION=BLOCKED_PRIVATE_ENV_MISSING_OR_LINKED"; exit 1
          fi
          if [ "$(stat -c %a "$PRIVATE")" != 600 ] || [ "$(stat -c %a /home/opc/botking-v2-private)" != 700 ]; then
            echo "V2_ACTIVATION=BLOCKED_PRIVATE_ENV_PERMISSIONS"; exit 1
          fi
          cd "$ROOT"
          "$ROOT/.venv/bin/python" -m pilot_v2.tools.v2_activation_gate --private-env-file "$PRIVATE"
          echo "V2_REAL_MASTER_AND_PAIRING=APPROVED_BY_LOCAL_GATE"
          # Do not activate a V2 gateway whose requested internal Dhan routes
          # cannot be served by the running V1 contract. GET OpenAPI is local-only,
          # no user key or Dhan token is sent.
          if ! curl -fsS --max-time 8 http://127.0.0.1:8000/openapi.json | python3 -c '
          import json,sys
          try:
              api=json.load(sys.stdin)
              paths=api.get("paths",{})
              required=("/dhan/index-ltp-batch", "/dhan/selected-ltp-batch")
              if not all("post" in paths.get(path,{}) for path in required):
                  sys.exit(1)
          except (ValueError,TypeError,AttributeError):
              sys.exit(1)
          '; then
            echo "V2_ACTIVATION=BLOCKED_UPSTREAM_DHAN_BATCH_CONTRACT_MISSING"; exit 1
          fi
          echo "V2_REQUIRED_DHAN_BATCH_ENDPOINTS=VERIFIED"
          # Never assume a new HTTPS location is safe to inject into the existing V1 virtual host.
          sudo -n nginx -t >/dev/null 2>&1
          # Static string presence is not proof of the correct proxy target.
          # Require a reviewed mapping to the isolated loopback V2 listener.
          # Require location and upstream in the SAME block. Separate grep
          # checks could accept an unrelated upstream or a commented location.
          if ! sudo -n nginx -T 2>/dev/null | python3 -c '
          import re,sys
          config=sys.stdin.read()
          config=re.sub(r"(?m)#.*$", "", config)
          location=re.compile(r"location\s+(?:\^~\s+)?(?:=\s+)?/v2-pilot/\s*\{")
          for match in location.finditer(config):
              depth=1
              i=match.end()
              while i<len(config) and depth:
                  if config[i]=="{": depth+=1
                  elif config[i]=="}": depth-=1
                  i+=1
              if depth: continue
              block=config[match.end():i-1]
              if re.search(r"\bproxy_pass\s+http://127\.0\.0\.1:8001\s*;", block) and not re.search(r"\brewrite\s",block):
                  sys.exit(0)
          sys.exit(1)
          '; then
            echo "V2_ACTIVATION=BLOCKED_EXACT_HTTPS_PROXY_ROUTE_UNVERIFIED"; exit 1
          fi
          if test -e "$UNIT" || test -L "$UNIT"; then
            echo "V2_ACTIVATION=BLOCKED_EXISTING_UNIT_REVIEW_REQUIRED"; exit 1
          fi
          if ss -lnt '( sport = :8001 )' | grep -q LISTEN; then
            echo "V2_ACTIVATION=BLOCKED_PORT_OCCUPIED"; exit 1
          fi
          sudo -n true
          rollback() {
            echo "V2_ACTIVATION=ROLLING_BACK"
            sudo -n systemctl stop bot-king-v2.service >/dev/null 2>&1 || true
            sudo -n systemctl disable bot-king-v2.service >/dev/null 2>&1 || true
            sudo -n rm -f "$UNIT"
            sudo -n systemctl daemon-reload || true
          }
          TMP_UNIT="$(mktemp /tmp/bot-king-v2-unit.XXXXXXXX)"
          cleanup_unit() { rm -f "$TMP_UNIT"; }
          rollback_on_exit() {
            rc=$?
            trap - EXIT ERR INT TERM
            if [ "$rc" -ne 0 ]; then
              rollback
            fi
            cleanup_unit
            exit "$rc"
          }
          trap rollback_on_exit EXIT
          trap 'exit 130' INT
          trap 'exit 143' TERM
          # No V1 files or Nginx configuration are written.
          cat > "$TMP_UNIT" <<'UNITFILE'
          [Unit]
          Description=BOT KING Version 2 isolated authenticated read-only gateway
          After=network-online.target bot-king.service
          Wants=network-online.target
          [Service]
          Type=simple
          User=opc
          Group=opc
          WorkingDirectory=/home/opc/botking-v2-staging/gh-94e814031896445874fa3f81677b85d118584f40
          EnvironmentFile=/home/opc/botking-v2-private/v2.env
          ExecStart=/home/opc/botking-v2-staging/gh-94e814031896445874fa3f81677b85d118584f40/.venv/bin/uvicorn pilot_v2.oracle_secure_entrypoint:create_app --factory --host 127.0.0.1 --port 8001 --workers 1
          Restart=on-failure
          RestartSec=5
          NoNewPrivileges=true
          PrivateTmp=true
          ProtectSystem=full
          [Install]
          WantedBy=multi-user.target
          UNITFILE
          sudo -n install -o root -g root -m 0644 "$TMP_UNIT" "$UNIT"
          cleanup_unit
          sudo -n systemctl daemon-reload
          sudo -n systemctl enable --now bot-king-v2.service >/dev/null
          test "$(systemctl is-active bot-king-v2.service)" = active
          test "$(curl -sS -o /dev/null -w '%{http_code}' --max-time 8 http://127.0.0.1:8001/v2-pilot/quotes)" = 401
          test "$(curl -sS -o /dev/null -w '%{http_code}' --max-time 8 https://botkingrajesh.duckdns.org/v2-pilot/quotes)" = 401
          # Independently prove HTTPS exposes the signed V2 challenge endpoint,
          # and still rejects an unknown device; this sends no credentials.
          for ORIGIN in http://127.0.0.1:8001 https://botkingrajesh.duckdns.org; do
            test "$(curl -sS -o /dev/null -w '%{http_code}' --max-time 8 -H 'Content-Type: application/json' --data '{"device_id":"unapproved-audit-probe"}' "$ORIGIN/v2-pilot/auth/challenge")" = 403
            test "$(curl -sS -o /dev/null -w '%{http_code}' --max-time 8 "$ORIGIN/v2-pilot/orders")" = 404
          done
          test "$(curl -fsS -o /dev/null -w '%{http_code}' --max-time 8 http://127.0.0.1:8000/health)" = 200
          echo "V2_GATEWAY_TRANSPORT=ACTIVE; V1=HEALTHY; LIVE_DHAN_QUOTES=NOT_VERIFIED; PHONE_SIGNED_LOGIN=NOT_VERIFIED"
          ACTIVATE
            echo "V2_ONE_CLICK_ACTIVATION=COMPLETE; SIGNED_PHONE_AND_LIVE_DHAN_ACCEPTANCE=PENDING"
            {
              echo "## BOT KING V2 — Oracle activation"
              echo "- Oracle authenticated gateway started on isolated localhost port 8001."
              echo "- V2 HTTPS negative-auth checks passed; V1 remained healthy."
              echo "- Real signed phone login and Dhan market quote **not yet verified**."
              echo "- Trading orders remain disabled."
            } >> "$GITHUB_STEP_SUMMARY"
          elif [ "$OPERATION" = "maintenance" ]; then
            if [ "$APPROVAL" != "APPROVE_ORACLE_CHANGE" ]; then
              echo "MAINTENANCE_REQUIRES_EXPLICIT_APPROVAL"; exit 1
            fi
            if [ -z "$OWNER_COMMAND" ] || [ "${#OWNER_COMMAND}" -gt 2000 ]; then
              echo "INVALID_OWNER_COMMAND"; exit 1
            fi
            # Never send secret contents or SSH identity to remote command.
            # The command is executed only after deliberate owner dispatch
            # and the protected GitHub environment has granted access.
            echo "MAINTENANCE_MODE=OWNER_APPROVED"
            printf '%s\n' "$OWNER_COMMAND" | "${SSH[@]}" "opc@$ORACLE_HOST" 'bash -se'
            echo "MAINTENANCE_EXIT=SUCCESS"
          else
            echo "INVALID_OPERATION"; exit 1
          fi
