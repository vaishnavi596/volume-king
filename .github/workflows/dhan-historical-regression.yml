name: Dhan Historical Candle Regression

on:
  push:
    branches: [main]
    paths:
      - 'backend/server.py'
      - 'backend/dhan_feed.py'
      - 'backend/tests/test_dhan_empty_candles.py'
      - '.github/workflows/dhan-historical-regression.yml'
  pull_request:
    paths:
      - 'backend/server.py'
      - 'backend/dhan_feed.py'
      - 'backend/tests/test_dhan_empty_candles.py'
      - '.github/workflows/dhan-historical-regression.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline-candle-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install backend test dependencies
        run: python -m pip install -r backend/requirements.txt
      - name: Run offline Dhan candle regression tests
        run: python -m unittest discover -s backend/tests -p 'test_dhan_empty_candles.py' -v
