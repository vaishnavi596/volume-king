name: BOT KING CLONE B2 Smart Priority Tests
on:
  push:
    branches:
      - pilot/v1-pure-original-clone-phone-20261120
    paths:
      - .github/workflows/clone-b2-smart-priority-tests.yml
      - src/main.py
      - src/clone_smart_refresh_priority.py
      - tests/test_clone_b2_priority.py
      - tests/test_v3_visible_watchlist_bootstrap_priority.py
      - tests/test_v3_watchlist_5_34_70_capacity.py
      - tests/test_v3_watchlist_quote_elapsed_diagnostic.py
  workflow_dispatch:
permissions:
  contents: read
jobs:
  b2-priority:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile source and priority tests
        run: |
          python -m py_compile src/main.py src/clone_smart_refresh_priority.py tests/test_clone_b2_priority.py tests/test_v3_visible_watchlist_bootstrap_priority.py tests/test_v3_watchlist_5_34_70_capacity.py tests/test_v3_watchlist_quote_elapsed_diagnostic.py
      - name: Run B2 focus contract regression
        run: |
          python -m unittest discover -s tests -p 'test_clone_b2_*.py' -v
          python -m unittest discover -s tests -p 'test_v3_visible_watchlist_bootstrap_priority.py' -v
          python -m unittest discover -s tests -p 'test_v3_watchlist_5_34_70_capacity.py' -v
          python -m unittest discover -s tests -p 'test_v3_watchlist_quote_elapsed_diagnostic.py' -v
