name: Backend regression checks (no APK)

on:
  push:
    branches: [ feature/dhan-market-data-audit ]
    paths:
      - 'backend/**'
      - 'tests/**'
      - '.github/workflows/backend-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install test dependencies
        run: python -m pip install -r backend/requirements.txt httpx==0.27.2 flet==0.25.2 flet-webview==0.1.0
      - name: Compile backend modules and tests
        run: python -m compileall -q backend tests src/market_feed.py
      - name: Run offline regression suite
        run: python -m unittest discover -s tests -v
