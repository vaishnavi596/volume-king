name: BOT KING CLONE B3 Full Regression Gate (No APK)
# Watchlist market-hours 09:10-15:45 IST and late-entry assessment regression gate (no APK)
# B3 combined rerun after consolidating 14 legacy-contract failures and active-page test coverage
on:
  push:
    branches:
      - pilot/v1-pure-original-clone-phone-20261120
    paths:
      - .github/workflows/clone-b3-full-regression.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  clone-full-regression:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install existing Clone regression dependencies
        run: |
          python -m pip install --disable-pip-version-check 'flet==0.25.2' 'flet-webview==0.1.0' 'fastapi==0.115.12' 'httpx==0.28.1'
          python -m pip install --disable-pip-version-check -r backend/requirements.txt
      - name: Validate complete latest Clone source
        run: |
          python -m compileall -q src tests backend
          bash -n ops/install_clone_v2_b3_oracle.sh
          bash -n ops/provision_clone_dhan_oauth_env.sh
          bash -n ops/provision_clone_from_existing_dhan_oauth.sh
          bash -n ops/cutover_clone_primary_existing_dhan.sh
      - name: Run all offline tests once together
        env:
          PYTHONPATH: src:tests:backend
        run: python -m unittest discover -s tests -v

