name: BOT KING Offline Regression Tests

on:
  push:
    branches: [main, botking-scanner-auth-30s-20261111, botking-signal-display-batch1-20261112]
    paths:
      - 'src/**'
      - 'tests/**'
      - 'backend/**'
      - '.github/workflows/test-only.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline-tests:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install flet==0.25.2 flet-webview==0.1.0
          python -m pip install -r backend/requirements.txt httpx==0.28.1
      - name: Check Python syntax
        run: python -m compileall -q src tests backend
      - name: Run offline regression suite (no APK build)
        run: python -m unittest discover -s tests -v
