name: Oracle Dhan read-only monitor tests
on:
  push:
    branches:
      - audit/oracle-dhan-credential-readiness
    paths:
      - backend/check-dhan-token-expiry.py
      - backend/test_dhan_token_monitor.py
      - backend/dhan_token_storage.py
      - backend/test_dhan_token_storage.py
      - backend/dhan_consent_validation.py
      - backend/test_dhan_consent_validation.py
      - .github/workflows/oracle-dhan-monitor-tests.yml
  workflow_dispatch:
jobs:
  offline-tests:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Compile monitor and tests
        run: python -m py_compile backend/check-dhan-token-expiry.py backend/test_dhan_token_monitor.py backend/dhan_token_storage.py backend/test_dhan_token_storage.py backend/dhan_consent_validation.py backend/test_dhan_consent_validation.py
      - name: Run offline unit tests without credentials or network
        run: python -m unittest discover -s backend -p 'test_dhan_*.py' -v
