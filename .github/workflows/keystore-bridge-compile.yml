name: Flet 0.25 Keystore Bridge Compile Probe
on:
  push:
    branches:
      - experiment/android-secure-storage-compat
    paths:
      - prototype/flet_keystore/**
      - .github/workflows/keystore-bridge-compile.yml
  workflow_dispatch:
jobs:
  bridge-compile:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: stable
          cache: true
      - name: Fetch pinned Flet 0.25.2 Flutter client
        run: git clone --depth 1 --branch v0.25.2 https://github.com/flet-dev/flet.git /tmp/flet025
      - name: Register experimental native Keystore control in upstream Flet client
        run: |
          set -euo pipefail
          cp -R prototype/flet_keystore /tmp/flet025/packages/botking_flet_keystore
          python3 - <<'PY'
          from pathlib import Path
          pub = Path('/tmp/flet025/client/pubspec.yaml')
          s = pub.read_text()
          needle = '  flet_flashlight:\n    path: ../packages/flet_flashlight\n'
          assert needle in s
          s = s.replace(needle, needle + '  botking_flet_keystore:\n    path: ../packages/botking_flet_keystore\n')
          pub.write_text(s)
          main = Path('/tmp/flet025/client/lib/main.dart')
          s = main.read_text()
          needle = "import 'package:flet_webview/flet_webview.dart' as flet_webview;"
          assert needle in s
          s = s.replace(needle, needle + "\nimport 'package:botking_flet_keystore/botking_flet_keystore.dart' as botking_keystore;")
          needle = '  flet_flashlight.ensureInitialized();'
          assert needle in s
          s = s.replace(needle, needle + '\n  botking_keystore.ensureInitialized();')
          needle = '      flet_flashlight.createControl,'
          assert needle in s
          s = s.replace(needle, needle + '\n      botking_keystore.createControl,')
          main.write_text(s)
          PY
      - name: Resolve pinned Flet client and Keystore dependencies
        run: |
          cd /tmp/flet025/client
          flutter pub get
      - name: Compile experimental native control with Flet 0.25.2
        run: |
          cd /tmp/flet025/client
          flutter analyze --no-pub lib/main.dart
          cd ../packages/botking_flet_keystore
          flutter pub get
          flutter analyze --no-pub lib
      - name: Compile integrated Flet client Android APK (debug, experimental)
        run: |
          cd /tmp/flet025/client
          flutter build apk --debug --target-platform android-arm64
