name: Build Boating Trading Bot APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install briefcase flet

      - name: Build Android APK
        run: |
          briefcase create android
          briefcase build android
          briefcase package android --packaging-format debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Boating-Trading-Bot-APK
          path: build/boating-trading-bot/*/android/gradle/app/build/outputs/apk/debug/app-debug.apk

