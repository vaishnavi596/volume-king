name: build
on:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: 'stable'
          cache: true

      - name: Flutter Doctor
        run: |
          flutter doctor -v
          flutter config --no-analytics

      - name: Create Config
        run: |
          ls -la
          if [ ! -f pyproject.toml ]; then
            echo '[project]
            name = "volume-king"
            version = "1.0.0"
            dependencies = ["flet==0.27.6"]
            [tool.flet]
            org = "com.volumeking"
            ' > pyproject.toml
          fi

      - name: Build APK
        run: |
          pip install flet==0.27.6
          flet build apk --verbose

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Volume-King-APK
          path: build/apk
