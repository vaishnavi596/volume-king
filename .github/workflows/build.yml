name: Build Android APK
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install Briefcase
        run: |
          pip install briefcase
          briefcase --version

      - name: Create SRC Structure
        run: |
          mkdir -p src/boating_trading_bot
          if [ -f main.py ]; then cp main.py src/boating_trading_bot/app.py; fi
          if [ -f src/main.py ]; then cp src/main.py src/boating_trading_bot/app.py; fi
          ls -R src/

      - name: Build Android APK
        run: |
          briefcase create android --no-input || true
          briefcase build android --no-input || true
          briefcase package android --no-input || true

      - name: Find APK
        run: |
          find build -name "*.apk" -type f || echo "Searching..."
          ls -R build/ || true

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Boating-Trading-Bot-APK
          path: |
            build/**/ *.apk
            build/boating-trading-bot/**/ *.apk
            **/*.apk
          if-no-files-found: warn
