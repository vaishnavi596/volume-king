name: Build APK
on:
  push:
    branches: [ main ]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          flutter-version: '3.22.3'
          
      - name: Install Flet
        run: pip install flet==0.24.1
        
      - name: Build APK
        run: |
          flet pack main.py --android --distpath dist
          
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: volume-king-apk
          path: dist
