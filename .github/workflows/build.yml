
name: Build APK

on:
  push:
    branches: [ main, bot-king-final-five-redesign ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Require the permanent signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$KEYSTORE_BASE64" && test -n "$STORE_PASSWORD" || { echo 'Permanent signing must be configured; debug-signed APK will not be published.'; exit 1; }
          python - <<'PY'
          import base64, os
          from pathlib import Path
          path=Path(os.environ['RUNNER_TEMP'])/'botking-release.jks'
          path.write_bytes(base64.b64decode(os.environ['KEYSTORE_BASE64'],validate=True))
          path.chmod(0o600)
          PY
          keytool -exportcert -keystore "$RUNNER_TEMP/botking-release.jks" -alias botking -storepass:env STORE_PASSWORD -file "$RUNNER_TEMP/botking-cert.der"
          test -f config/android-signing.sha256
          EXPECTED=$(tr -d '[:space:]' < config/android-signing.sha256)
          ACTUAL=$(sha256sum "$RUNNER_TEMP/botking-cert.der" | cut -d' ' -f1)
          test "$EXPECTED" = "$ACTUAL" || { echo 'Signing certificate changed. Stopping to preserve update compatibility.'; exit 1; }

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: stable
          cache: true

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Accept Android licenses
        run: yes | flutter doctor --android-licenses || true

      - name: Install required Android NDK
        run: |
          set -e
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          echo "Android SDK: $SDK_ROOT"
          for attempt in 1 2 3; do
            echo "Installing NDK 25.1.8937393 (attempt $attempt)"
            if yes | "$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$SDK_ROOT" "ndk;25.1.8937393"; then
              test -f "$SDK_ROOT/ndk/25.1.8937393/source.properties" && break
            fi
            rm -rf "$SDK_ROOT/ndk/25.1.8937393"
            sleep 10
          done
          test -f "$SDK_ROOT/ndk/25.1.8937393/source.properties"

      - name: Install Flet
        run: pip install flet==0.25.2

      - name: Verify Flet version
        run: flet --version

      - name: Check Python syntax before APK packaging
        run: python -m py_compile src/main.py src/scanner_engine.py

      - name: Verify build dependencies
        run: |
          python -m pip check
          python -c "import flet; import importlib.metadata as m; print('Flet:', m.version('flet'))"

      - name: Offline UI and persistence regression tests
        run: |
          pip install -r backend/requirements.txt httpx==0.28.1
          python -m unittest discover -s tests -v

      - name: Build APK
        env:
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          set -euo pipefail
          BUILD_CODE=$(( $(date -u +%s) - 1704067200 + 1000000 ))
          test "$BUILD_CODE" -gt 1000000
          test "$BUILD_CODE" -le 2100000000
          flet build apk --include-packages flet_webview --build-number "$BUILD_CODE"
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          BUILD_TOOLS=$(find "$SDK_ROOT/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)
          APK=build/apk/app-release.apk
          "$BUILD_TOOLS/apksigner" sign --ks "$RUNNER_TEMP/botking-release.jks" --ks-key-alias botking --ks-pass env:STORE_PASSWORD --key-pass env:STORE_PASSWORD --out "$RUNNER_TEMP/botking-signed.apk" "$APK"
          "$BUILD_TOOLS/apksigner" verify --verbose "$RUNNER_TEMP/botking-signed.apk"
          "$BUILD_TOOLS/aapt" dump badging "$RUNNER_TEMP/botking-signed.apk" > "$RUNNER_TEMP/botking-manifest.txt"
          grep -F "package: name='com.botking.bot_king'" "$RUNNER_TEMP/botking-manifest.txt"
          grep -F "versionCode='$BUILD_CODE'" "$RUNNER_TEMP/botking-manifest.txt"
          EXPECTED=$(tr -d '[:space:]' < config/android-signing.sha256)
          ACTUAL=$("$BUILD_TOOLS/apksigner" verify --print-certs "$RUNNER_TEMP/botking-signed.apk" | sed -n 's/.*certificate SHA-256 digest: //p' | sort -u)
          test "$EXPECTED" = "$ACTUAL"
          cp "$RUNNER_TEMP/botking-signed.apk" "$APK"
          rm -f build/apk/*.idsig

      - name: Remove private signing files
        if: always()
        run: rm -f "$RUNNER_TEMP/botking-release.jks" "$RUNNER_TEMP/botking-cert.der" "$RUNNER_TEMP/botking-signed.apk"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: volume-king-apk
          path: build/apk/*.apk
          if-no-files-found: error
