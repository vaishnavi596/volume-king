
name: Build APK

on:
  push:
    branches: [ main, bot-king-final-five-redesign, broker-only-release-prep, audit-prebuild-no-apk ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: stable
          cache: true

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Accept Android licenses
        run: yes | flutter doctor --android-licenses || true

      - name: Install required Android NDK
        run: |
          set -e
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          echo "Android SDK: $SDK_ROOT"
          for attempt in 1 2 3; do
            echo "Installing NDK 25.1.8937393 (attempt $attempt)"
            if yes | "$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$SDK_ROOT" "ndk;25.1.8937393"; then
              test -f "$SDK_ROOT/ndk/25.1.8937393/source.properties" && break
            fi
            rm -rf "$SDK_ROOT/ndk/25.1.8937393"
            sleep 10
          done
          test -f "$SDK_ROOT/ndk/25.1.8937393/source.properties"

      - name: Install Flet
        run: pip install flet==0.25.2

      - name: Verify Flet version
        run: flet --version

      - name: Check Python syntax before APK packaging
        run: python -m py_compile src/main.py src/scanner_engine.py

      - name: Verify build dependencies
        run: |
          python -m pip check
          python -c "import flet; import importlib.metadata as m; print('Flet:', m.version('flet'))"

      - name: Offline UI and persistence regression tests
        run: |
          pip install -r backend/requirements.txt httpx==0.28.1
          python -m unittest discover -s tests -v

      - name: Build APK
        run: |
          set -euo pipefail
          BUILD_CODE=$((10000 + GITHUB_RUN_NUMBER * 100 + GITHUB_RUN_ATTEMPT))
          flet build apk --include-packages flet_webview --verbose --build-number "$BUILD_CODE"

      - name: Verify APK signature and package metadata
        run: |
          set -euo pipefail
          shopt -s nullglob
          apks=(build/apk/*.apk)
          test "${#apks[@]}" -gt 0
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          APKSIGNER="$(find "$SDK_ROOT/build-tools" -name apksigner -type f | sort -V | tail -1)"
          AAPT="$(find "$SDK_ROOT/build-tools" -name aapt -type f | sort -V | tail -1)"
          test -n "$APKSIGNER" && test -n "$AAPT"
          for apk in "${apks[@]}"; do
            "$APKSIGNER" verify --verbose --print-certs "$apk"
            "$AAPT" dump badging "$apk" | head -n 4
          done

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: volume-king-apk
          path: build/apk/*.apk
          if-no-files-found: error
