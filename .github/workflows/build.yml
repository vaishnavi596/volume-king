
name: Build APK

on:
  push:
    branches: [ main, bot-king-final-five-redesign ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: stable
          cache: true

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Accept Android licenses
        run: yes | flutter doctor --android-licenses || true

      - name: Install required Android NDK
        run: |
          set -e
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          echo "Android SDK: $SDK_ROOT"
          for attempt in 1 2 3; do
            echo "Installing NDK 25.1.8937393 (attempt $attempt)"
            if yes | "$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$SDK_ROOT" "ndk;25.1.8937393"; then
              test -f "$SDK_ROOT/ndk/25.1.8937393/source.properties" && break
            fi
            rm -rf "$SDK_ROOT/ndk/25.1.8937393"
            sleep 10
          done
          test -f "$SDK_ROOT/ndk/25.1.8937393/source.properties"

      - name: Install Flet
        run: pip install flet==0.25.2

      - name: Verify Flet version
        run: flet --version

      - name: Check Python syntax before APK packaging
        run: python -m py_compile src/main.py

      - name: Build APK
        run: flet build apk --verbose

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: volume-king-apk
          path: build/apk/*.apk
          if-no-files-found: error
