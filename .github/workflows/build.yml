
name: Build APK

# APK builds are manual only. Code edits must not trigger an APK build.
on:
  push:
    branches: [ main ]
    paths: [ pyproject.toml ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: stable
          cache: true

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Accept Android licenses
        run: yes | flutter doctor --android-licenses || true

      - name: Install required Android NDK
        run: |
          set -e
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          echo "Android SDK: $SDK_ROOT"
          for attempt in 1 2 3; do
            echo "Installing NDK 25.1.8937393 (attempt $attempt)"
            if yes | "$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$SDK_ROOT" "ndk;25.1.8937393"; then
              test -f "$SDK_ROOT/ndk/25.1.8937393/source.properties" && break
            fi
            rm -rf "$SDK_ROOT/ndk/25.1.8937393"
            sleep 10
          done
          test -f "$SDK_ROOT/ndk/25.1.8937393/source.properties"

      - name: Install Flet
        run: pip install flet==0.25.2

      - name: Verify Flet version
        run: flet --version

      - name: Check Python syntax before APK packaging
        run: python -m py_compile src/main.py src/scanner_engine.py

      - name: Verify build dependencies
        run: |
          python -m pip check
          python -c "import flet; import importlib.metadata as m; print('Flet:', m.version('flet'))"

      - name: Offline UI and persistence regression tests
        run: |
          pip install -r backend/requirements.txt httpx==0.28.1
          python -m unittest discover -s tests -v

      - name: Require permanent Android release signing
        env:
          BOTKING_KEYSTORE_BASE64: ${{ secrets.BOTKING_KEYSTORE_BASE64 }}
          BOTKING_KEYSTORE_PASSWORD: ${{ secrets.BOTKING_KEYSTORE_PASSWORD }}
          BOTKING_KEY_PASSWORD: ${{ secrets.BOTKING_KEY_PASSWORD }}
          BOTKING_KEY_ALIAS: ${{ secrets.BOTKING_KEY_ALIAS }}
          BOTKING_SIGNING_SHA256: ${{ secrets.BOTKING_SIGNING_SHA256 }}
        run: |
          set -euo pipefail
          for var in BOTKING_KEYSTORE_BASE64 BOTKING_KEYSTORE_PASSWORD BOTKING_KEY_PASSWORD BOTKING_KEY_ALIAS BOTKING_SIGNING_SHA256; do
            if [[ -z "${!var}" ]]; then
              echo "::error::Permanent release signing is not configured: missing $var. Refusing to build a differently signed APK."
              exit 1
            fi
          done
          umask 077
          printf '%s' "$BOTKING_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/botking-release.jks"
          keytool -list -v -keystore "$RUNNER_TEMP/botking-release.jks" -storepass "$BOTKING_KEYSTORE_PASSWORD" -alias "$BOTKING_KEY_ALIAS" > "$RUNNER_TEMP/botking-key-info.txt"
          ACTUAL="$(grep -m1 'SHA256:' "$RUNNER_TEMP/botking-key-info.txt" | sed 's/.*SHA256: //' | tr -d ':[:space:]' | tr '[:lower:]' '[:upper:]')"
          EXPECTED="$(printf '%s' "$BOTKING_SIGNING_SHA256" | tr -d ':[:space:]' | tr '[:lower:]' '[:upper:]')"
          if [[ -z "$ACTUAL" || "$ACTUAL" != "$EXPECTED" ]]; then
            echo "::error::Release signing certificate differs from pinned BOTKING_SIGNING_SHA256."
            exit 1
          fi
          echo "FLET_ANDROID_SIGNING_KEY_STORE=$RUNNER_TEMP/botking-release.jks" >> "$GITHUB_ENV"
          echo "FLET_ANDROID_SIGNING_KEY_STORE_PASSWORD=$BOTKING_KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
          echo "FLET_ANDROID_SIGNING_KEY_ALIAS=$BOTKING_KEY_ALIAS" >> "$GITHUB_ENV"
          echo "FLET_ANDROID_SIGNING_KEY_PASSWORD=$BOTKING_KEY_PASSWORD" >> "$GITHUB_ENV"
          echo "Permanent signing verified; fingerprint is pinned."

      - name: Build APK (retry transient Maven HTTP 429 errors)
        run: |
          set -euo pipefail
          BUILD_CODE=$((10000 + GITHUB_RUN_NUMBER * 100 + GITHUB_RUN_ATTEMPT))
          for attempt in 1 2 3 4; do
            echo "APK build attempt ${attempt}/4"
            if flet build apk --include-packages flet_webview --verbose --build-number "$BUILD_CODE" 2>&1 | tee /tmp/volume-king-build.log; then
              echo "APK build succeeded"
              exit 0
            fi
            if ! grep -Eq '429|Too Many Requests|Could not GET|Read timed out|Connection reset' /tmp/volume-king-build.log; then
              echo "Non-network build failure; stopping retries"
              exit 1
            fi
            if [ "$attempt" -eq 4 ]; then
              echo "Build failed after 4 attempts"
              exit 1
            fi
            sleep $((attempt * 45))
          done

      - name: Inspect APK identity and signing certificate
        run: |
          set -euo pipefail
          APK="$(find build/apk -type f -name '*.apk' | head -n 1)"
          test -n "$APK"
          echo "APK: $APK"
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          BUILD_TOOLS="$(find "$SDK_ROOT/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)"
          "$BUILD_TOOLS/aapt" dump badging "$APK" > /tmp/botking-apk-badging.txt
          grep "^package:" /tmp/botking-apk-badging.txt
          "$BUILD_TOOLS/apksigner" verify --print-certs "$APK" > /tmp/botking-apk-signature.txt 2>&1 || {
            cat /tmp/botking-apk-signature.txt
            echo "::error::APK signature verification failed; refusing to upload."
            exit 1
          }
          cat /tmp/botking-apk-signature.txt
          ACTUAL="$(grep -m1 'certificate SHA-256 digest:' /tmp/botking-apk-signature.txt | sed 's/.*certificate SHA-256 digest: //' | tr -d ':[:space:]' | tr '[:lower:]' '[:upper:]')"
          EXPECTED="$(printf '%s' "${{ secrets.BOTKING_SIGNING_SHA256 }}" | tr -d ':[:space:]' | tr '[:lower:]' '[:upper:]')"
          if [[ -z "$ACTUAL" || "$ACTUAL" != "$EXPECTED" ]]; then
            echo "::error::APK signing certificate mismatch; refusing to upload."
            exit 1
          fi
          echo "Compare package name, versionCode, and certificate SHA-256 with the currently installed APK before attempting an in-place update."

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: volume-king-apk
          path: build/apk/*.apk
          if-no-files-found: error
