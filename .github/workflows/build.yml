name: Build APK

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install Flet
        run: |
          python -m pip install --upgrade pip
          pip install flet==0.27.6

      - name: Build APK
        run: |
          flet build apk --verbose --build-number 1 --build-version 1.0.0
          
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: volume-king-apk
          path: build/apk
