
name: Build APK

on:
  push:
    branches: [ main, bot-king-final-five-redesign ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Restore permanent release signing key
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "$KEYSTORE_B64" ] || [ -z "$STORE_PASSWORD" ]; then
            echo "::error::Permanent signing is not configured. Add ANDROID_KEYSTORE_BASE64 and ANDROID_KEYSTORE_PASSWORD. A temporary-key APK will not be published."
            exit 1
          fi
          umask 077
          printf '%s' "$KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/botking-release.jks"
          keytool -list -keystore "$RUNNER_TEMP/botking-release.jks" -storepass:env STORE_PASSWORD -alias botking >/dev/null

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: stable
          cache: true

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Accept Android licenses
        run: yes | flutter doctor --android-licenses || true

      - name: Install required Android NDK
        run: |
          set -e
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          echo "Android SDK: $SDK_ROOT"
          for attempt in 1 2 3; do
            echo "Installing NDK 25.1.8937393 (attempt $attempt)"
            if yes | "$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$SDK_ROOT" "ndk;25.1.8937393"; then
              test -f "$SDK_ROOT/ndk/25.1.8937393/source.properties" && break
            fi
            rm -rf "$SDK_ROOT/ndk/25.1.8937393"
            sleep 10
          done
          test -f "$SDK_ROOT/ndk/25.1.8937393/source.properties"

      - name: Install Flet
        run: pip install flet==0.25.2

      - name: Verify Flet version
        run: flet --version

      - name: Check Python syntax before APK packaging
        run: python -m py_compile src/main.py src/scanner_engine.py

      - name: Verify build dependencies
        run: |
          python -m pip check
          python -c "import flet; import importlib.metadata as m; print('Flet:', m.version('flet'))"

      - name: Offline UI and persistence regression tests
        run: python -m unittest discover -s tests -v

      - name: Build APK
        env:
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          set -euo pipefail
          # Same application identity; monotonic version code even for reruns.
          BUILD_CODE=$((10000 + GITHUB_RUN_NUMBER * 100 + GITHUB_RUN_ATTEMPT))
          flet build apk --include-packages flet_webview --verbose \
            --build-number "$BUILD_CODE"
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          BUILD_TOOLS="$(find "$SDK_ROOT/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)"
          test -x "$BUILD_TOOLS/apksigner"
          test -x "$BUILD_TOOLS/aapt"
          APK="build/apk/app-release.apk"
          # Explicitly replace any temporary Flet/Flutter signature.
          "$BUILD_TOOLS/apksigner" sign --ks "$RUNNER_TEMP/botking-release.jks" \
            --ks-key-alias botking --ks-pass env:STORE_PASSWORD --key-pass env:STORE_PASSWORD \
            --out "$RUNNER_TEMP/botking-signed.apk" "$APK"
          "$BUILD_TOOLS/apksigner" verify --verbose "$RUNNER_TEMP/botking-signed.apk"
          "$BUILD_TOOLS/aapt" dump badging "$RUNNER_TEMP/botking-signed.apk" > "$RUNNER_TEMP/botking-manifest.txt"
          grep -F "package: name='com.botking.bot_king'" "$RUNNER_TEMP/botking-manifest.txt"
          grep -F "versionCode='$BUILD_CODE'" "$RUNNER_TEMP/botking-manifest.txt"
          # Compare the APK certificate to the configured keystore certificate.
          keytool -exportcert -keystore "$RUNNER_TEMP/botking-release.jks" -alias botking \
            -storepass:env STORE_PASSWORD -file "$RUNNER_TEMP/botking-cert.der" >/dev/null
          EXPECTED="$(sha256sum "$RUNNER_TEMP/botking-cert.der" | cut -d' ' -f1)"
          ACTUAL="$("$BUILD_TOOLS/apksigner" verify --print-certs "$RUNNER_TEMP/botking-signed.apk" | sed -n 's/^Signer #1 certificate SHA-256 digest: //p')"
          test "$EXPECTED" = "$ACTUAL"
          cp "$RUNNER_TEMP/botking-signed.apk" "$APK"
          rm -f build/apk/*.idsig

      - name: Remove signing files
        if: always()
        run: rm -f "$RUNNER_TEMP/botking-release.jks" "$RUNNER_TEMP/botking-cert.der" "$RUNNER_TEMP/botking-signed.apk"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: volume-king-apk
          path: build/apk/*.apk
          if-no-files-found: error
