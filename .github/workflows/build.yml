# Build request: 2026-11-12 commit 208ee4a tests green; package two-day Dhan scanner fix.

name: Build APK

# Build a new APK automatically whenever the release version file changes.
# Keep ordinary source/test commits from launching expensive APK builds.
on:
  workflow_dispatch:
  push:
    branches: [main, botking-b1-index-mapping-20261114]
    paths:
      - pyproject.toml

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: stable
          cache: true

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Verify APK display version matches project release version
        run: |
          python3 - <<'PY'
          import pathlib, re, tomllib
          project = tomllib.loads(pathlib.Path("pyproject.toml").read_text())
          expected = project["project"]["version"]
          source = pathlib.Path("src/main.py").read_text()
          match = re.search(r'^\s*APP_VERSION = "(\d+\.\d+\.\d+)"\s*# Release fallback;', source, re.M)
          if not match or match.group(1) != expected:
              raise SystemExit(f"Version mismatch: project={expected}, runtime fallback={match.group(1) if match else 'missing'}")
          print(f"Verified project and runtime fallback: {expected}")
          PY

      - name: Cache verified Gradle 8.7 distribution
        uses: actions/cache@v4
        with:
          path: ~/.gradle/wrapper/dists/gradle-8.7-bin
          key: botking-gradle-8.7-bin-544c35d6-v1

      - name: Preload checksum-verified Gradle 8.7 with mirror fallback
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib
          from pathlib import Path
          url = "https://services.gradle.org/distributions/gradle-8.7-bin.zip"
          n = int.from_bytes(hashlib.md5(url.encode()).digest(), "big")
          digits = "0123456789abcdefghijklmnopqrstuvwxyz"
          result = ""
          while n:
              n, rem = divmod(n, 36)
              result = digits[rem] + result
          path = Path.home() / ".gradle" / "wrapper" / "dists" / "gradle-8.7-bin" / result
          path.mkdir(parents=True, exist_ok=True)
          Path("/tmp/botking-gradle-cache-dir").write_text(str(path))
          print("Gradle wrapper distribution cache:", path)
          PY
          DIST_DIR="$(cat /tmp/botking-gradle-cache-dir)"
          DIST_ZIP="$DIST_DIR/gradle-8.7-bin.zip"
          EXPECTED_SHA="544c35d6bd849ae8a5ed0bcea39ba677dc40f49df7d1835561582da2009b961d"
          if ! echo "$EXPECTED_SHA  $DIST_ZIP" | sha256sum --check --status 2>/dev/null; then
            rm -f "$DIST_ZIP"
            # Official Gradle CDN returned HTTP 504 repeatedly. Try independent
            # distribution mirrors; only accept the pinned official SHA-256.
            for URL in \
              "https://mirrors.huaweicloud.com/gradle/gradle-8.7-bin.zip" \
              "https://mirrors.cloud.tencent.com/gradle/gradle-8.7-bin.zip" \
              "https://downloads.gradle.org/distributions/gradle-8.7-bin.zip"; do
              echo "Trying Gradle distribution host: ${URL%%/gradle-8.7-bin.zip}"
              rm -f "$DIST_ZIP"
              if curl -fL --retry 2 --retry-all-errors --retry-delay 5 \
                --connect-timeout 20 --max-time 240 "$URL" --output "$DIST_ZIP" \
                && echo "$EXPECTED_SHA  $DIST_ZIP" | sha256sum --check; then
                echo "Verified Gradle distribution downloaded."
                break
              fi
              rm -f "$DIST_ZIP"
            done
          fi
          echo "$EXPECTED_SHA  $DIST_ZIP" | sha256sum --check
          echo "Verified Gradle 8.7 ZIP ready for Flet wrapper."

      - name: Accept Android licenses
        run: yes | flutter doctor --android-licenses || true

      - name: Install required Android NDK
        run: |
          set -e
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          echo "Android SDK: $SDK_ROOT"
          for attempt in 1 2 3; do
            echo "Installing NDK 25.1.8937393 (attempt $attempt)"
            if yes | "$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$SDK_ROOT" "ndk;25.1.8937393"; then
              test -f "$SDK_ROOT/ndk/25.1.8937393/source.properties" && break
            fi
            rm -rf "$SDK_ROOT/ndk/25.1.8937393"
            sleep 10
          done
          test -f "$SDK_ROOT/ndk/25.1.8937393/source.properties"

      - name: Install Flet
        run: pip install flet==0.25.2 flet-webview==0.1.0

      - name: Verify Flet version
        run: flet --version

      - name: Check Python syntax before APK packaging
        run: python -m py_compile src/main.py src/scanner_engine.py

      - name: Verify build dependencies
        run: |
          python -m pip check
          python -c "import flet; import importlib.metadata as m; print('Flet:', m.version('flet'))"

      - name: Offline UI and persistence regression tests
        run: |
          set -o pipefail
          pip install -r backend/requirements.txt httpx==0.28.1
          python -m unittest discover -s tests -v 2>&1 | tee /tmp/botking-unittest.log

      - name: Upload full regression test failure details
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: botking-regression-test-log
          path: /tmp/botking-unittest.log
          if-no-files-found: ignore

      - name: Require permanent Android release signing
        env:
          BOTKING_KEYSTORE_BASE64: ${{ secrets.BOTKING_KEYSTORE_BASE64 }}
          BOTKING_KEYSTORE_PASSWORD: ${{ secrets.BOTKING_KEYSTORE_PASSWORD }}
          BOTKING_KEY_PASSWORD: ${{ secrets.BOTKING_KEY_PASSWORD }}
          BOTKING_KEY_ALIAS: ${{ secrets.BOTKING_KEY_ALIAS }}
          BOTKING_SIGNING_SHA256: ${{ secrets.BOTKING_SIGNING_SHA256 }}
        run: |
          set -euo pipefail
          for var in BOTKING_KEYSTORE_BASE64 BOTKING_KEYSTORE_PASSWORD BOTKING_KEY_PASSWORD BOTKING_KEY_ALIAS BOTKING_SIGNING_SHA256; do
            if [[ -z "${!var}" ]]; then
              echo "::error::Permanent release signing is not configured: missing $var. Refusing to build a differently signed APK."
              exit 1
            fi
          done
          umask 077
          printf '%s' "$BOTKING_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/botking-release.jks"
          keytool -list -v -keystore "$RUNNER_TEMP/botking-release.jks" -storepass "$BOTKING_KEYSTORE_PASSWORD" -alias "$BOTKING_KEY_ALIAS" > "$RUNNER_TEMP/botking-key-info.txt"
          ACTUAL="$(grep -m1 'SHA256:' "$RUNNER_TEMP/botking-key-info.txt" | sed 's/.*SHA256: //' | tr -d ':[:space:]' | tr '[:lower:]' '[:upper:]')"
          EXPECTED="$(printf '%s' "$BOTKING_SIGNING_SHA256" | tr -d ':[:space:]' | tr '[:lower:]' '[:upper:]')"
          if [[ -z "$ACTUAL" || "$ACTUAL" != "$EXPECTED" ]]; then
            echo "::error::Release signing certificate differs from pinned BOTKING_SIGNING_SHA256."
            exit 1
          fi
          echo "FLET_ANDROID_SIGNING_KEY_STORE=$RUNNER_TEMP/botking-release.jks" >> "$GITHUB_ENV"
          echo "FLET_ANDROID_SIGNING_KEY_STORE_PASSWORD=$BOTKING_KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
          echo "FLET_ANDROID_SIGNING_KEY_ALIAS=$BOTKING_KEY_ALIAS" >> "$GITHUB_ENV"
          echo "FLET_ANDROID_SIGNING_KEY_PASSWORD=$BOTKING_KEY_PASSWORD" >> "$GITHUB_ENV"
          echo "Permanent signing verified; fingerprint is pinned."

      # The upstream Python release endpoint intermittently returns HTTP 504.
      # Do not block the entire APK build on an extra diagnostic download.
      # Flet handles its own bootstrap; failures are captured below.

      - name: Prepare local Python 3.12 bootstrap fallback
        run: |
          set -euo pipefail
          python3 --version
          # pip 25.x detects Android wheel tags via platform.android_ver(),
          # which is unavailable in this Linux-host bootstrap. Pin pip to the
          # pre-Android-tag implementation used by the Flet 0.25 generation.
          python3 -m pip install --disable-pip-version-check "pip==24.0"
          python3 -m pip --version
          # Flet 0.25.2 uses a host Python interpreter to install Android wheels.
          # The upstream distributive download can return an empty extraction.
          # Watch for its bootstrap directory and provide the runner's Python
          # 3.12 interpreter when the upstream executable is missing.
          cat > "$RUNNER_TEMP/botking-bootstrap-watch.py" <<'PY'
          import os
          import pathlib
          import shutil
          import sys
          import time
          root = pathlib.Path.cwd() / "build/flutter/build/build_python_3.12.6/python/bin"
          source = pathlib.Path(sys.executable).resolve()
          deadline = time.monotonic() + 1200
          while time.monotonic() < deadline:
              parent = root.parent.parent
              if parent.exists():
                  root.mkdir(parents=True, exist_ok=True)
                  target = root / "python3"
                  if not target.exists():
                      try:
                          target.symlink_to(source)
                          print(f"Fallback Python bootstrap: {target} -> {source}", flush=True)
                      except OSError as exc:
                          print(f"Fallback bootstrap retry: {exc}", flush=True)
              time.sleep(0.05)
          PY
          nohup python3 -u "$RUNNER_TEMP/botking-bootstrap-watch.py" > "$RUNNER_TEMP/botking-bootstrap-watch.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/botking-bootstrap-watch.pid"

      - name: Configure Gradle Android runtime download retries
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.gradle/init.d"
          cat > "$HOME/.gradle/init.d/botking-runtime-download.gradle" <<'GRADLE'
          allprojects { project ->
              project.tasks.configureEach { task ->
                  if (task.name.startsWith('downloadDistArchive_')) {
                      try {
                          task.retries = 12
                          task.retryDelay = 15000
                          logger.lifecycle("BOT KING: configured 12 retries (15s delay) for ${task.path}")
                      } catch (Exception e) {
                          logger.warn("BOT KING: download task does not expose retry properties: ${e.message}")
                      }
                  }
              }
          }
          GRADLE
          echo "Gradle init script installed to retry failed Python Android archive transfers."

      - name: Build APK with Python bootstrap diagnostics
        run: |
          set -euo pipefail
          BUILD_CODE=$((10000 + GITHUB_RUN_NUMBER * 100 + GITHUB_RUN_ATTEMPT))
          for attempt in 1 2 3 4; do
            echo "BOT KING APK build attempt $attempt/4"
            if flet build apk --arch arm64-v8a --include-packages flet_webview --verbose --build-number "$BUILD_CODE" 2>&1 | tee /tmp/volume-king-build.log; then
              echo "APK build succeeded"
              break
            fi
            echo "DIAGNOSTIC: Inspecting Flet Python bootstrap"
            BOOTSTRAP="build/flutter/build/build_python_3.12.6"
            ls -lah "$BOOTSTRAP" "$BOOTSTRAP/python" "$BOOTSTRAP/python/bin" 2>&1 || true
            cat "$RUNNER_TEMP/botking-bootstrap-watch.log" || true
            df -h . /tmp || true
            if ! grep -Eiq 'Gateway Time-out|Gateway Timeout|HTTP status code: (504|503|502|429)|Connection timed out|Connection reset|Read timed out|SocketTimeoutException|Too Many Requests|downloadDistArchive_' /tmp/volume-king-build.log; then
              echo "::error::Non-transient APK build failure; stopping retries."
              exit 1
            fi
            if [ "$attempt" -eq 4 ]; then
              echo "::error::Android runtime download failed after four attempts."
              exit 1
            fi
            echo "Transient Android runtime download failure; waiting before retry."
            sleep $((attempt * 35))
          done

      - name: Upload Python packaging failure log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: botking-python-bootstrap-diagnostics
          path: /tmp/volume-king-build.log
          if-no-files-found: warn

      - name: Sign APK with permanent release keystore
        env:
          BOTKING_KEYSTORE_PASSWORD: ${{ secrets.BOTKING_KEYSTORE_PASSWORD }}
          BOTKING_KEY_PASSWORD: ${{ secrets.BOTKING_KEY_PASSWORD }}
          BOTKING_KEY_ALIAS: ${{ secrets.BOTKING_KEY_ALIAS }}
        run: |
          set -euo pipefail
          APK="$(find build/apk -type f -name '*.apk' | head -n 1)"
          test -n "$APK"
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          BUILD_TOOLS="$(find "$SDK_ROOT/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)"
          # Flet currently produces a debug-signed APK. Remove that signature and
          # sign the final artifact with our pinned permanent key.
          "$BUILD_TOOLS/zipalign" -f -p 4 "$APK" "$RUNNER_TEMP/botking-aligned.apk"
          "$BUILD_TOOLS/apksigner" sign \
            --ks "$RUNNER_TEMP/botking-release.jks" \
            --ks-key-alias "$BOTKING_KEY_ALIAS" \
            --ks-pass env:BOTKING_KEYSTORE_PASSWORD \
            --key-pass env:BOTKING_KEY_PASSWORD \
            --out "$RUNNER_TEMP/botking-signed.apk" \
            "$RUNNER_TEMP/botking-aligned.apk"
          cp "$RUNNER_TEMP/botking-signed.apk" "$APK"

      - name: Inspect APK identity and signing certificate
        run: |
          set -euo pipefail
          APK="$(find build/apk -type f -name '*.apk' | head -n 1)"
          test -n "$APK"
          echo "APK: $APK"
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          BUILD_TOOLS="$(find "$SDK_ROOT/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)"
          "$BUILD_TOOLS/aapt" dump badging "$APK" > /tmp/botking-apk-badging.txt
          grep "^package:" /tmp/botking-apk-badging.txt
          python3 - <<'PY'
          import pathlib, re, tomllib, os
          expected = tomllib.loads(pathlib.Path("pyproject.toml").read_text())["project"]["version"]
          badging = pathlib.Path("/tmp/botking-apk-badging.txt").read_text()
          match = re.search(r"^package:.*versionCode='(\d+)'.*versionName='([^']+)'", badging, re.M)
          if not match:
              raise SystemExit("APK package/version metadata missing")
          code, actual = int(match.group(1)), match.group(2)
          minimum = 10000 + int(os.environ["GITHUB_RUN_NUMBER"]) * 100 + int(os.environ["GITHUB_RUN_ATTEMPT"])
          if actual != expected or code != minimum:
              raise SystemExit(f"APK version mismatch: expected {expected}/{minimum}, got {actual}/{code}")
          print(f"Verified APK versionName={actual} versionCode={code}")
          PY
          "$BUILD_TOOLS/apksigner" verify --print-certs "$APK" > /tmp/botking-apk-signature.txt 2>&1 || {
            cat /tmp/botking-apk-signature.txt
            echo "::error::APK signature verification failed; refusing to upload."
            exit 1
          }
          cat /tmp/botking-apk-signature.txt
          ACTUAL="$(grep -m1 'certificate SHA-256 digest:' /tmp/botking-apk-signature.txt | sed 's/.*certificate SHA-256 digest: //' | tr -d ':[:space:]' | tr '[:lower:]' '[:upper:]')"
          EXPECTED="$(printf '%s' "${{ secrets.BOTKING_SIGNING_SHA256 }}" | tr -d ':[:space:]' | tr '[:lower:]' '[:upper:]')"
          if [[ -z "$ACTUAL" || "$ACTUAL" != "$EXPECTED" ]]; then
            echo "::error::APK signing certificate mismatch; refusing to upload."
            exit 1
          fi
          echo "Compare package name, versionCode, and certificate SHA-256 with the currently installed APK before attempting an in-place update."

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: volume-king-apk
          path: build/apk/*.apk
          if-no-files-found: error
