name: Build Volume King APK
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          
      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y openjdk-17-jdk unzip
          pip install buildozer cython
          
      - name: Build with Buildozer
        run: |
          mkdir -p src
          cp main.py src/main.py || true
          buildozer init || true
          # buildozer.spec me kivy add karna
          sed -i 's/requirements =.*/requirements = python3,kivy/' buildozer.spec || echo "requirements = python3,kivy" >> buildozer.spec
          buildozer -v android debug || true
          
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Volume-King-APK
          path: bin/*.apk
