name: Build APK
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Flet
        run: pip install flet
      - name: Build APK
        run: flet build apk -v
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: volume-king-apk
          path: build/apk
