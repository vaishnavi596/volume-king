name: Keystore Smoke APK Packaging Probe
on:
  push:
    branches:
      - experiment/android-secure-storage-compat
    paths:
      - .github/workflows/keystore-smoke-packaging-probe.yml
      - prototype/device_keystore_smoke.py
      - src/keystore_control.py
  workflow_dispatch:
jobs:
  inspect-packaging:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: stable
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned Flet and build prerequisites
        run: python -m pip install 'flet==0.25.2' 'flet-webview==0.1.0'
      - name: Stage isolated smoke-test application
        run: |
          mkdir -p /tmp/botking-keystore-smoke/src
          cp prototype/device_keystore_smoke.py /tmp/botking-keystore-smoke/src/main.py
          cp src/keystore_control.py /tmp/botking-keystore-smoke/src/keystore_control.py
          cp src/secure_credentials.py /tmp/botking-keystore-smoke/src/secure_credentials.py
          cat > /tmp/botking-keystore-smoke/pyproject.toml <<'TOML'
          [project]
          name = "botking-keystore-smoke"
          version = "0.0.1"
          dependencies = ["flet==0.25.2"]
          requires-python = ">=3.11"
          [tool.flet]
          product = "BOT KING Keystore TEST"
          org = "org.botking.keystoretest"
          company = "BOT KING Experimental"
          [tool.flet.app]
          path = "src"
          module = "main"
          TOML
      - name: Verify smoke app startup imports before APK build
        run: |
          cd /tmp/botking-keystore-smoke
          PYTHONPATH=src python - <<'PY'
          import keystore_control
          import secure_credentials
          import ast
          from pathlib import Path
          source = Path("src/main.py").read_text()
          tree = ast.parse(source)
          imports = [n for n in tree.body if isinstance(n, (ast.Import, ast.ImportFrom))]
          exec(compile(ast.Module(body=imports, type_ignores=[]), "src/main.py", "exec"), {})
          print("Smoke app startup imports resolved")
          PY
      - name: Probe Flet generated Flutter layout
        working-directory: /tmp/botking-keystore-smoke
        run: |
          set +e
          timeout 1200 flet build apk --arch arm64-v8a --verbose > /tmp/keystore-smoke-build.log 2>&1
          result=$?
          echo "Flet bootstrap exit: $result" >> /tmp/keystore-smoke-build.log
          find build/flutter -maxdepth 5 -type f | grep -E '/(main\\.dart|pubspec\\.yaml|[^/]+\\.gradle)$' | sort > /tmp/keystore-flutter-layout.txt || true
          for file in build/flutter/pubspec.yaml build/flutter/lib/main.dart; do
            if test -f "$file"; then
              echo "=== $file ===" >> /tmp/keystore-flutter-layout.txt
              grep -nE 'flet:|flet_webview|createControl|ensureInitialized|applicationId' "$file" >> /tmp/keystore-flutter-layout.txt || true
            fi
          done
          # Do not publish a falsely described secure APK: the native control
          # has NOT been injected into this generated Flutter project.
          exit 0
      - name: Audit generated Python payload before native injection
        working-directory: /tmp/botking-keystore-smoke
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import zipfile
          root = Path("build")
          matches = sorted(p for p in root.rglob("*.zip") if p.is_file())
          print("Generated ZIP payloads:")
          for p in matches:
              print(p, p.stat().st_size)
              try:
                  with zipfile.ZipFile(p) as z:
                      names = z.namelist()
                      for term in ("main.py", "keystore_control.py", "secure_credentials.py"):
                          hits = [n for n in names if n.endswith(term)]
                          if hits:
                              print("  ", term, hits[:4])
              except zipfile.BadZipFile:
                  print("  not a ZIP archive")
          for path in (Path("src/main.py"), Path("src/keystore_control.py"), Path("src/secure_credentials.py")):
              assert path.is_file(), f"Missing staged source: {path}"
          for p in sorted((root / "site-packages").rglob("*")):
              if p.is_dir() and p.name in ("flet", "flet_core", "flet_runtime"):
                  print("Python dependency directory:", p)
          print("Python staging audit complete; device startup remains unverified")
          PY
      - name: Preserve pre-injection baseline APK for runtime isolation
        run: |
          set -euo pipefail
          apk=/tmp/botking-keystore-smoke/build/flutter/build/app/outputs/flutter-apk/app-release.apk
          if test -s "$apk"; then
            mkdir -p /tmp/keystore-baseline
            cp "$apk" /tmp/keystore-baseline/flet-baseline-no-native-plugin.apk
            echo "Baseline Flet APK preserved; compare startup against native-injected APK."
          else
            echo "No baseline APK produced by initial Flet build." >&2
          fi
      - name: Publish baseline APK without native Keystore plugin
        uses: actions/upload-artifact@v4
        with:
          name: botking-keystore-baseline-no-native-plugin
          path: /tmp/keystore-baseline/flet-baseline-no-native-plugin.apk
          if-no-files-found: warn
          retention-days: 7
      - name: Rebuild untouched Flutter project to isolate second-build runtime crash
        working-directory: /tmp/botking-keystore-smoke
        run: |
          set -euo pipefail
          cd build/flutter
          export SERIOUS_PYTHON_SITE_PACKAGES="$(pwd)/../site-packages/arm64-v8a"
          test -d "$SERIOUS_PYTHON_SITE_PACKAGES"
          flutter build apk --release --target-platform android-arm64
          mkdir -p /tmp/keystore-second-build-control
          cp build/app/outputs/flutter-apk/app-release.apk /tmp/keystore-second-build-control/flet-second-build-no-plugin.apk
      - name: Publish second-build control APK without native plugin
        uses: actions/upload-artifact@v4
        with:
          name: botking-keystore-second-build-no-plugin
          path: /tmp/keystore-second-build-control/flet-second-build-no-plugin.apk
          if-no-files-found: error
          retention-days: 7
      - name: Inject native Keystore plugin into generated Flet Flutter app
        working-directory: /tmp/botking-keystore-smoke
        run: |
          set -euo pipefail
          mkdir -p build/flutter/packages
          cp -R "$GITHUB_WORKSPACE/prototype/flet_keystore" build/flutter/packages/botking_flet_keystore
          python3 - <<'PY'
          from pathlib import Path
          root = Path("build/flutter")
          plugin = root / "packages/botking_flet_keystore/pubspec.yaml"
          ps = plugin.read_text()
          assert "    path: ../flet" in ps
          plugin.write_text(ps.replace("    path: ../flet", "    version: 0.25.2"))
          pub = root / "pubspec.yaml"
          ps = pub.read_text()
          assert "  flet: 0.25.2" in ps
          ps = ps.replace("  flet: 0.25.2", "  flet: 0.25.2" + chr(10) + "  botking_flet_keystore:" + chr(10) + "    path: packages/botking_flet_keystore", 1)
          pub.write_text(ps)
          main = root / "lib/main.dart"
          ms = main.read_text()
          assert "List<CreateControlFactory> createControlFactories = [" in ms
          ms = "import 'package:botking_flet_keystore/botking_flet_keystore.dart' as botking_keystore;" + chr(10) + ms
          ms = ms.replace("List<CreateControlFactory> createControlFactories = [", "List<CreateControlFactory> createControlFactories = [" + chr(10) + "  botking_keystore.createControl,", 1)
          main.write_text(ms)
          assert "botking_keystore.createControl" in main.read_text()
          print("Native factory registered in the packaged Flet Flutter client")
          PY
          cd build/flutter
          flutter pub get
          flutter analyze --no-pub --no-fatal-infos lib/main.dart packages/botking_flet_keystore/lib
          export SERIOUS_PYTHON_SITE_PACKAGES="$(pwd)/../site-packages/arm64-v8a"
          test -d "$SERIOUS_PYTHON_SITE_PACKAGES"
          flutter build apk --release --target-platform android-arm64
      - name: Inspect final APK Python runtime and bundled payload
        working-directory: /tmp/botking-keystore-smoke
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile
          import json
          apk = Path("build/flutter/build/app/outputs/flutter-apk/app-release.apk")
          assert apk.is_file(), "Final APK missing"
          with ZipFile(apk) as z:
              names = z.namelist()
              assets = [n for n in names if n.startswith("assets/flutter_assets/")]
              py = [n for n in names if "python" in n.lower() or n.endswith((".py", ".pyc", ".zip"))]
              libs = [n for n in names if n.startswith("lib/arm64-v8a/")]
              report = {
                  "apk_bytes": apk.stat().st_size,
                  "python_related_entries": py[:120],
                  "python_runtime_libraries": [n for n in libs if "python" in n.lower()],
                  "asset_count": len(assets),
                  "asset_samples": assets[:100],
                  "lib_count": len(libs),
              }
              from io import BytesIO
              app_archive = "assets/flutter_assets/app/app.zip"
              assert app_archive in names, "Packaged Python app.zip missing"
              with ZipFile(BytesIO(z.read(app_archive))) as app:
                  app_files = app.namelist()
                  report["python_app_archive_entries"] = app_files[:250]
                  report["python_app_archive_count"] = len(app_files)
                  report["python_app_required_files"] = {
                      required: [n for n in app_files if n == required or n.endswith("/" + required)]
                      for required in ("main.py", "keystore_control.py", "secure_credentials.py")
                  }
                  for required, hits in report["python_app_required_files"].items():
                      assert hits, f"Missing {required} in final APK embedded app.zip"
                  report["python_app_archive_corrupt_member"] = app.testzip()
                  assert report["python_app_archive_corrupt_member"] is None, "Corrupt Python app.zip member"
              out = Path("/tmp/keystore-final-apk-audit.json")
              out.write_text(json.dumps(report, indent=2))
              print(out.read_text())
              assert any("libpython3.12.so" in n for n in libs), "Missing Python 3.12 native runtime"
              assert assets, "Flutter assets missing from APK"
          PY
      - name: Capture Android startup debugging guidance
        run: |
          cat > /tmp/keystore-device-diagnostics.txt <<'EOF'
          Android device validation is required even if GitHub build succeeds.
          Target package: org.botking.keystoretest.botking_keystore_smoke
          The observed device failure was PyRun_SimpleString result -1 followed by SIGSEGV in libpython3.12.so.
          This is NOT proof of a Keystore failure. Check Python bootstrap and packaged assets.
          Suggested device capture:
            adb logcat -c
            adb shell monkey -p org.botking.keystoretest.botking_keystore_smoke -c android.intent.category.LAUNCHER 1
            adb logcat -d -v time -b main -b crash
          Never use real server access keys for this test.
          EOF
      - name: Publish isolated native Keystore smoke APK
        uses: actions/upload-artifact@v4
        with:
          name: botking-keystore-smoke-native-test-apk
          path: /tmp/botking-keystore-smoke/build/flutter/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 7
      - name: Upload Flutter packaging diagnostics only
        uses: actions/upload-artifact@v4
        with:
          name: keystore-smoke-packaging-diagnostics
          path: |
            /tmp/keystore-smoke-build.log
            /tmp/keystore-flutter-layout.txt
            /tmp/keystore-final-apk-audit.json
            /tmp/keystore-device-diagnostics.txt
          if-no-files-found: error
          retention-days: 7
