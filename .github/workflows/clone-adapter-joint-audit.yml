name: BOT KING CLONE Adapter Joint Audit
on:
  push:
    branches:
      - pilot/v1-pure-original-clone-phone-20261120
    paths:
      - .github/workflows/clone-adapter-joint-audit.yml
      - src/main.py
      - backend/clone_v2_gateway.py
      - src/clone_v2_gateway.py
      - tests/test_clone_adapter_audit.py
      - tests/test_clone_b3_market_diagnostics.py
  workflow_dispatch:
permissions:
  contents: read
jobs:
  adapters:
    runs-on: ubuntu-22.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install diagnostic test dependencies
        run: python -m pip install 'fastapi>=0.110,<1' 'httpx>=0.27,<1'
      - name: Compile adapters
        run: |
          python -m py_compile src/main.py src/clone_v2_gateway.py backend/clone_v2_gateway.py tests/test_clone_adapter_audit.py
      - name: Validate mapped equity diagnostic contract
        run: python -m unittest discover -s tests -p 'test_clone_b3_market_diagnostics.py' -v
      - name: Validate guarded Clone-only diagnostic updater syntax
        run: bash -n ops/update_clone_b3_gateway_diagnostics_20261121.sh
      - name: Validate guarded Clone candle cache updater syntax
        run: bash -n ops/update_clone_b3_candle_cache_20261121.sh
      - name: Validate guarded Clone index quote cache updater syntax
        run: bash -n ops/update_clone_b3_index_quote_cache_20261121.sh
      - name: Joint adapter context and refresh audit
        run: python -m unittest discover -s tests -p 'test_clone_adapter_audit.py' -v
