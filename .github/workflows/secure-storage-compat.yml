name: Secure Storage Compatibility Probe
on:
  push:
    branches:
      - experiment/android-secure-storage-compat
  workflow_dispatch:
jobs:
  probe:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install isolated upgraded Flet and native extension Python API
        run: |
          python -m pip install "flet==1.1.2" "flet-secure-storage==1.1.2"
          python -m pip check
      - name: Prove extension imports against upgraded Flet runtime
        run: |
          python - <<'PY'
          import importlib.metadata as m
          print("Flet:", m.version("flet"))
          print("Secure storage:", m.version("flet-secure-storage"))
          assert m.version("flet") == "1.1.2", "Secure storage and Flet version mismatch"
          from flet_secure_storage import SecureStorage
          print("Extension import OK:", SecureStorage)
          PY

      - name: Audit BOT KING Flet control API against upgraded runtime
        run: |
          python - <<'PY'
          import ast
          import pathlib
          import flet as ft
          source = pathlib.Path("src/main.py").read_text(encoding="utf-8")
          ast.parse(source)
          tree = ast.parse(source)
          controls = sorted({
              node.attr for node in ast.walk(tree)
              if isinstance(node, ast.Attribute)
              and isinstance(node.value, ast.Name)
              and node.value.id == "ft"
          })
          missing = [name for name in controls if not hasattr(ft, name)]
          print("Flet attributes referenced:", len(controls))
          print("Missing from upgraded Flet:", missing)
          if missing:
              raise SystemExit("BOT KING requires API migration before Flet 1.1.2 upgrade")
          PY
