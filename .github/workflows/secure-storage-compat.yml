name: Secure Storage Compatibility Probe
on:
  push:
    branches:
      - experiment/android-secure-storage-compat
  workflow_dispatch:
jobs:
  probe:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install isolated upgraded Flet and native extension Python API
        run: |
          python -m pip install "flet==1.1.2" "flet-secure-storage==1.1.2"
          python -m pip check
      - name: Prove extension imports against upgraded Flet runtime
        run: |
          python - <<'PY'
          import importlib.metadata as m
          print("Flet:", m.version("flet"))
          print("Secure storage:", m.version("flet-secure-storage"))
          assert m.version("flet") == "1.1.2", "Secure storage and Flet version mismatch"
          from flet_secure_storage import SecureStorage
          print("Extension import OK:", SecureStorage)
          PY
