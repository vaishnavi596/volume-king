name: BOT KING V2 One-Click Safe Migration Gate
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: botking-v2-oneclick-gate-${{ github.ref }}
  cancel-in-progress: false
jobs:
  final-migration-gate:
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile V2 and run entire offline regression once
        id: regression
        continue-on-error: true
        run: |
          python -m pip install cryptography==44.0.3 fastapi==0.115.12 httpx==0.28.1
          python -m compileall -q pilot_v2
          python -m unittest discover -s pilot_v2/tests -p 'test_*.py' -q
      - name: Final V1-to-V2 parity and provider boundary audit
        id: audit
        continue-on-error: true
        run: |
          python pilot_v2/tools/one_click_migration_gate.py --strict
      - name: Publish audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v2-one-click-migration-audit
          path: pilot_v2/migration_report.md
          if-no-files-found: error
      - name: Block completion on any failed gate
        if: always()
        env:
          REGRESSION: ${{ steps.regression.outcome }}
          AUDIT: ${{ steps.audit.outcome }}
        run: |
          test "$REGRESSION" = success
          test "$AUDIT" = success
