name: Secure Dhan Pairing Unit Tests
on:
  push:
    branches:
      - experiment/android-secure-storage-compat
    paths:
      - src/secure_credentials.py
      - src/secure_dhan_pairing.py
      - tests/test_secure_credentials.py
      - tests/test_secure_dhan_pairing.py
      - tests/test_keystore_bridge_contract.py
      - tests/test_keystore_runtime_gate.py
      - src/keystore_control.py
      - prototype/device_keystore_smoke.py
      - .github/workflows/secure-pairing-tests.yml
  workflow_dispatch:
jobs:
  secure-pairing:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned Flet runtime for bridge contract tests
        run: python -m pip install 'flet==0.25.2'
      - name: Compile secure pairing modules
        run: python -m py_compile src/secure_credentials.py src/secure_dhan_pairing.py src/keystore_control.py prototype/device_keystore_smoke.py
      - name: Test credential store and verified pairing behavior
        run: |
          python -m unittest discover -s tests -p 'test_secure*.py' -v
          python -m unittest discover -s tests -p 'test_keystore_bridge_contract.py' -v
          python -m unittest discover -s tests -p 'test_keystore_runtime_gate.py' -v
