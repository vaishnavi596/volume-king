# Exact V1 Dhan OAuth callback URL, handed to the new primary Clone backend.
# Owner must add this exact-match location INSIDE the existing HTTPS server {}
# for botkingrajesh.duckdns.org, then run nginx -t and perform controlled reload.
# This snippet does not automatically mutate Oracle or touch broker settings.
# Exact match wins over the existing prefix /dhan/ -> old V1.
location = /dhan/callback {
    proxy_pass http://127.0.0.1:8002;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header Connection "";
    proxy_connect_timeout 5s;
    proxy_read_timeout 25s;
    proxy_redirect off;
    add_header Cache-Control "no-store" always;
}
