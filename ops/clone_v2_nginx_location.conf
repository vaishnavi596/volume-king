# B2 clone-only HTTPS reverse-proxy block.
# Add ONLY inside the existing owner-reviewed HTTPS server {} for
# botkingrajesh.duckdns.org; do not remove/overwrite V1 /dhan/ routes.
# This file is a snippet/template, NOT auto-installed on Oracle.
location ^~ /clone-v2/ {
    proxy_pass http://127.0.0.1:8002;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header Connection "";
    proxy_connect_timeout 5s;
    proxy_read_timeout 20s;
    proxy_redirect off;
    add_header Cache-Control "no-store" always;
}
